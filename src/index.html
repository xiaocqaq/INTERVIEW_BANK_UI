  <style>
    :root {
      --bg-canvas: #f3ece5;
      --bg-surface: #ffffff;
      --bg-elevated: #f1f5f9;
      --border-subtle: #e2e8f0;
      --text-primary: #241b14;
      --text-secondary: #475569;
    }
    html.dark {
      --bg-canvas: #14100d;
      --bg-surface: #111827;
      --bg-elevated: #1e293b;
      --border-subtle: #1f2937;
      --text-primary: #f3ece5;
      --text-secondary: #94a3b8;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow-x: hidden;
    }
    /* Custom thin scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.5);
    }
    .glass-header {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .bento-card {
      transition: transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.18s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.18s ease;
    }
    .bento-card:hover {
      transform: translateY(-2px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    /* ---------- 后端 Markdown 渲染出的 answer_html 排版 ---------- */
    .answer-prose p { margin: 0.55em 0; }
    .answer-prose p:first-child { margin-top: 0; }
    .answer-prose p:last-child { margin-bottom: 0; }
    .answer-prose ul, .answer-prose ol { margin: 0.55em 0 0.55em 1.2em; padding-left: 0.6em; }
    .answer-prose ul { list-style: disc; }
    .answer-prose ol { list-style: decimal; }
    .answer-prose li { margin: 0.25em 0; }
    .answer-prose strong { font-weight: 700; color: #241b14; }
    html.dark .answer-prose strong { color: #f3ece5; }
    .answer-prose code { font-family: 'JetBrains Mono', Menlo, Consolas, monospace; font-size: 0.86em; padding: 0.12em 0.36em; border-radius: 0.3rem; background: rgba(148,163,184,0.18); }
    .answer-prose a { color: #059669; text-decoration: underline; text-underline-offset: 2px; }
    html.dark .answer-prose a { color: #34d399; }
    .answer-prose blockquote { margin: 0.6em 0; padding-left: 0.9em; border-left: 3px solid rgba(16,185,129,0.35); color: #475569; }
    html.dark .answer-prose blockquote { color: #94a3b8; }
    .answer-prose table { width: 100%; border-collapse: collapse; margin: 0.8em 0; font-size: 0.92em; }
    .answer-prose th, .answer-prose td { border: 1px solid rgba(148,163,184,0.35); padding: 0.45em 0.7em; text-align: left; vertical-align: top; }
    .answer-prose th { background: rgba(148,163,184,0.14); font-weight: 700; }
    .answer-prose h3, .answer-prose h4 { font-weight: 700; margin: 0.9em 0 0.4em; }
    /* 代码块（pygments one-dark 配色，浅色主题下也保持深底） */
    .answer-prose .codehilite, .avoid-dark-invert .codehilite {
      border-radius: 0.75rem; margin: 0.8em 0; overflow-x: auto;
      border: 1px solid rgba(148,163,184,0.25);
    }
    .answer-prose .codehilite pre, .avoid-dark-invert .codehilite pre {
      margin: 0; padding: 1rem 1.1rem; overflow-x: auto; line-height: 1.55;
      font-family: 'JetBrains Mono', Menlo, Monaco, Consolas, monospace; font-size: 12.5px;
    }
    .answer-prose .codehilite code, .avoid-dark-invert .codehilite code { background: none; padding: 0; font-size: inherit; }
    /* 顶栏下滑自动隐藏 / 上滑显示（收起高度，不占位） */
    #app-header {
      flex-shrink: 0; overflow: hidden;
      transition: height 0.28s ease, opacity 0.2s ease, border-color 0.2s ease;
    }
    #app-header.header-hidden {
      height: 0 !important;
      min-height: 0 !important;
      opacity: 0;
      border-bottom-width: 0;
      pointer-events: none;
    }
    /* 移动端侧栏原先靠 pt-16 避开顶栏，顶栏收起时同步归零 */
    @media (max-width: 1023px) {
      body.header-collapsed #app-sidebar { padding-top: 0 !important; }
    }
    /* 视图切换动效：旧内容做「快照淡出」，新内容做位移淡入 */
    #view-container { position: relative; }
    #view-container > .view-ghost {
      position: absolute; left: 0; right: 0; top: 0; z-index: 20;
      pointer-events: none; background: var(--bg-canvas); will-change: opacity;
    }
    button:not(:disabled) { -webkit-tap-highlight-color: transparent; }
    button:not(:disabled):active { transform: scale(0.97); }
    @media (prefers-reduced-motion: reduce) {
      #app-header { transition: none; }
      button:not(:disabled):active { transform: none; }
    }

  <!-- ======================= APPLICATION LOGIC & DATA ======================= -->
  <script>

// ============================================================
    // 1. 数据层：全部来自后端 API（/api/*），本地只缓存登录 token 与主题
    // ============================================================

    const TRACK_META = [
      { id: 'java',   name: 'Java 题库',     shortName: 'Java',   totalCount: 0,
        badgeClass: 'bg-orange-500/10 text-orange-600 dark:text-orange-400 border-orange-500/20',
        dotClass: 'bg-orange-500' },
      { id: 'python', name: 'Python 题库',   shortName: 'Python', totalCount: 0,
        badgeClass: 'bg-sky-500/10 text-sky-600 dark:text-sky-400 border-sky-500/20',
        dotClass: 'bg-sky-500' },
      { id: 'llm',    name: '大模型应用 题库', shortName: '大模型应用', totalCount: 0,
        badgeClass: 'bg-purple-500/10 text-purple-600 dark:text-purple-400 border-purple-500/20',
        dotClass: 'bg-purple-500' }
    ];

    // 分类描述（后端不返回 desc，按 lang/slug 补文案）
    const CATEGORY_DESC = {
      'java/basics': '泛型、反射、异常体系、String 与基础语法核心考点',
      'java/oop': '封装继承多态的对象模型、SOLID 原则、设计模式选型与领域建模',
      'java/collections': 'HashMap 底层扩容、ConcurrentHashMap、ArrayList 与树化机制',
      'java/concurrency': 'JMM 内存模型、volatile、synchronized 锁升级、AQS 与线程池',
      'java/jvm': '内存区域划分、类加载双亲委派、垃圾回收算法与 G1/ZGC 调优',
      'java/spring': 'IoC 容器启动、Bean 生命周期、三级缓存循环依赖、AOP 与事务传播',
      'java/mysql': 'InnoDB 索引 B+ 树、MVCC 多版本并发、事务隔离级别与慢查询优化',
      'java/redis': '五大数据结构底层、持久化 RDB/AOF、缓存穿透雪崩与分布式锁',
      'java/distributed': 'CAP 与 BASE、分布式事务 TCC/Saga、分布式锁、消息队列与幂等、服务治理',
      'python/basics': '动态类型机制、深浅拷贝、装饰器闭包、迭代器与生成器原理',
      'python/datastruct': 'dict 哈希表紧凑布局、list 动态扩容、set 集合与内存管理机制',
      'python/concurrency': '全局解释器锁 GIL、多进程 multiprocessing、asyncio 事件循环与协程',
      'python/oop': '魔术方法、MRO C3 超类线性化、元类 metaclass 与属性描述符',
      'python/stdlib': '虚拟环境管理、上下文管理器 with、日志体系、类型注解与单元测试',
      'python/web': 'FastAPI 异步依赖注入、Django ORM 中间件、WSGI 与 ASGI 协议对比',
      'llm/basics': 'Transformer 自注意力、Token 计费、Temperature/Top-p 采样与流式输出',
      'llm/prompting': 'Few-shot、CoT 思维链、结构化 JSON 输出约束与抗提示词注入',
      'llm/rag': '文档切分策略、Embedding 向量检索、混合检索 BM25 + Rerank 重排优化',
      'llm/tools': 'Function Calling 原理、ReAct 推理循环、Plan-and-Solve 与异常自愈',
      'llm/serving': 'KV Cache 显存优化、Prefix Caching、量化部署 vLLM 与吞吐延迟权衡',
      'llm/eval': 'RAGAS 评估指标、LLM-as-a-Judge、幻觉检测与护栏 Guardrails',
      'llm/mcp': 'Model Context Protocol 架构、Host/Client/Server 通信、Resources 与 Tools',
      'llm/skills': '动态上下文组装、渐进式技能挂载、长窗口压缩与 Token 预算分配',
      'llm/multiagent': 'Supervisor 路由模式、Handoffs 交接协议、层级协作与死循环防护',
      'llm/memory': '短期会话窗口、长期向量记忆、实体知识图谱提取与 Checkpointer',
      'llm/langchain': 'LCEL 声明式管道、Runnable 协议、OutputParser 与回调链路追踪',
      'llm/langgraph': 'StateGraph 状态机建模、条件边路由、Human-in-the-loop 断点审批',
      'llm/deepagent': 'DeepAgent 规划-执行-反思循环、子代理委派与深度搜索策略'
    };

    // 运行时数据：由 loadCategories / loadAllQuestions 填充
    let TRACK_GROUPS = TRACK_META.map(g => ({ ...g, categories: [] }));
    let QUESTIONS = [];        // 全量题目（427 条，含 last_status / favorite / in_wrong_book）
    let DETAIL_CACHE = {};     // id -> 详情（含 answer_html）
    let SERVER_STATS = null;   // /api/stats（仅登录后）
    let CATEGORY_NAMES = {};
    let API_TOTAL = 0;
    let BOOTED = false;

    // ---------- HTTP ----------
    const API = {
      token() {
        try { return state.token || ''; } catch (e) { return ''; }
      },
      async req(path, opts) {
        opts = opts || {};
        const headers = { 'Content-Type': 'application/json' };
        const tk = API.token();
        if (tk) headers['Authorization'] = 'Bearer ' + tk;
        let res;
        try {
          res = await fetch('/api' + path, {
            method: opts.method || 'GET',
            headers,
            body: opts.body ? JSON.stringify(opts.body) : undefined
          });
        } catch (e) {
          const err = new Error('网络异常，请稍后重试');
          err.status = 0;
          throw err;
        }
        let data = null;
        try { data = await res.json(); } catch (e) { data = null; }
        if (!res.ok) {
          if (res.status === 401) API.clearAuth();
          const msg = (data && (data.detail || data.error)) || ('请求失败 ' + res.status);
          const err = new Error(typeof msg === 'string' ? msg : JSON.stringify(msg));
          err.status = res.status;
          throw err;
        }
        return data;
      },
      clearAuth() {
        state.token = '';
        state.user = null;
        try { localStorage.removeItem('mianshi_token'); } catch (e) {}
      }
    };

    // 后端难度 1/2/3 ↔ 前端文案
    const DIFF_LABEL = { 1: '简单', 2: '中等', 3: '困难' };
    const DIFF_CODE = { '简单': 1, '中等': 2, '困难': 3 };
    // 后端 status：1 掌握 / 2 模糊 / 3 不会
    const STATUS_LABEL = { 1: 'mastered', 2: 'fuzzy', 3: 'unknown' };
    const STATUS_CODE = { mastered: 1, fuzzy: 2, unknown: 3 };

    function decorateQuestion(q) {
      const meta = TRACK_META.find(g => g.id === q.lang);
      return {
        id: q.id,
        track: q.lang,
        trackName: meta ? meta.name : q.lang,
        categoryId: q.lang + '/' + q.category,
        categoryName: CATEGORY_NAMES[q.lang + '/' + q.category] || q.category,
        title: q.title,
        difficulty: DIFF_LABEL[q.difficulty] || '中等',
        difficultyCode: q.difficulty,
        tags: q.tags || [],
        favorite: !!q.favorite,
        lastStatus: q.last_status ? STATUS_LABEL[q.last_status] : null,
        inWrongBook: !!q.in_wrong_book
      };
    }

    function findQuestion(id) {
      return QUESTIONS.find(q => q.id === id) || null;
    }

    async function loadCategories() {
      const data = await API.req('/categories');
      const cats = (data && data.categories) || [];
      CATEGORY_NAMES = {};
      TRACK_GROUPS = TRACK_META.map(g => ({ ...g, categories: [], totalCount: 0 }));
      cats.forEach(c => {
        const g = TRACK_GROUPS.find(x => x.id === c.lang);
        if (!g) return;
        CATEGORY_NAMES[c.lang + '/' + c.slug] = c.name;
        g.categories.push({
          id: c.lang + '/' + c.slug,
          slug: c.slug,
          name: c.name,
          count: c.count,
          desc: CATEGORY_DESC[c.lang + '/' + c.slug] || '',
          trackId: c.lang
        });
        g.totalCount += c.count;
      });
      API_TOTAL = TRACK_GROUPS.reduce((s, g) => s + g.totalCount, 0);
      updateStaticCounts();
    }

    // 用真实题数替换页面上写死的 414 / 143 / 109 / 162
    function updateStaticCounts() {
      const byId = {};
      TRACK_GROUPS.forEach(g => { byId[g.id] = g.totalCount; });
      document.querySelectorAll('[data-count-total]').forEach(el => { el.textContent = API_TOTAL; });
      Object.keys(byId).forEach(k => {
        document.querySelectorAll('[data-count-track="' + k + '"]').forEach(el => { el.textContent = byId[k]; });
      });
      const sub = document.getElementById('brand-subtitle');
      if (sub) sub.textContent = 'Java · Python · 大模型应用 (' + API_TOTAL + ' 题)';
    }

    // 拉全量题目：后端 page_size 上限 200，按页循环
    async function loadAllQuestions() {
      const collected = [];
      let page = 1;
      let total = Infinity;
      while (collected.length < total && page <= 20) {
        const data = await API.req('/questions?page=' + page + '&page_size=200');
        total = data.total || 0;
        const items = data.items || [];
        if (!items.length) break;
        collected.push.apply(collected, items);
        page += 1;
      }
      API_TOTAL = total === Infinity ? collected.length : total;
      QUESTIONS = collected.map(decorateQuestion);
      reconcileProgress();
      updateStaticCounts();
      return QUESTIONS;
    }

    async function loadQuestionDetail(id, force) {
      if (!force && DETAIL_CACHE[id]) return DETAIL_CACHE[id];
      const d = await API.req('/questions/' + id);
      DETAIL_CACHE[id] = d;
      return d;
    }

    async function loadStats() {
      if (!state.token) { SERVER_STATS = null; return null; }
      try {
        SERVER_STATS = await API.req('/stats');
        return SERVER_STATS;
      } catch (e) {
        SERVER_STATS = null;
        return null;
      }
    }

    async function refreshMe() {
      if (!state.token) return null;
      try {
        const d = await API.req('/auth/me');
        state.user = d.user || null;
        return state.user;
      } catch (e) {
        state.user = null;
        return null;
      }
    }

    // 把后端 answer_html 拆成 核心答案 / 深入解析 / 常见追问 / 代码示例 四段
    function splitAnswerHtml(html) {
      const out = { core: '', analysis: '', followups: '', code: '' };
      if (!html) return out;
      const doc = new DOMParser().parseFromString('<div id="__root">' + html + '</div>', 'text/html');
      const root = doc.getElementById('__root');
      if (!root) { out.core = html; return out; }
      let bucket = 'core';
      const map = { '核心答案': 'core', '深入解析': 'analysis', '常见追问': 'followups', '代码示例': 'code' };
      Array.from(root.childNodes).forEach(node => {
        if (node.nodeType === 1 && node.tagName === 'H2') {
          const key = (node.textContent || '').trim();
          if (map[key]) bucket = map[key];
          return;
        }
        if (node.nodeType === 1) {
          out[bucket] += node.outerHTML;
        } else if (node.nodeType === 3 && (node.textContent || '').trim()) {
          out[bucket] += escapeHtml(node.textContent);
        }
      });
      return out;
    }

    function stripHtml(html) {
      if (!html) return '';
      const d = document.createElement('div');
      d.innerHTML = html;
      return (d.textContent || '').replace(/\s+/g, ' ').trim();
    }

    function htmlToCodeText(html) {
      const d = document.createElement('div');
      d.innerHTML = html || '';
      const pre = d.querySelector('pre');
      return (pre ? pre.textContent : d.textContent) || '';
    }

// 3. Reactive Application State（本地只持久化主题 / 显示偏好 / token；进度以服务端为准）
    const state = {
      token: '',
      user: null,          // { id, username, display_name, role }
      themeMode: 'system', // 'light' | 'dark' | 'system'
      homeTrackFilter: 'all', // 'all' | 'java' | 'python' | 'llm'
      listTrackFilter: 'all',
      listCategoryFilter: 'all',
      listDifficultyFilter: 'all', // 'all' | '简单' | '中等' | '困难'
      listMasteryFilter: 'all',    // 'all' | 'unrated' | 'mastered' | 'fuzzy' | 'unknown'
      searchQuery: '',
      expandedTracks: { java: true, python: true, llm: true },
      sidebarTab: 'categories',   // 'categories' | 'questions'
      sidebarQuestionScope: 'category',   // 侧栏只列当前小节
      sidebarScopeMenuOpen: false,
      sidebarScopePopoverTrack: 'java',
      sidebarStatusFilter: 'all',
      sidebarSearch: '',
      currentQuestionId: 1,
      lastQuestionId: null,   // 上次学习的题（本地持久化，首页「继续学习」用）
      answerExpanded: false,
      codeExpanded: false,
      alwaysExpandAnswer: false,
      autoNextOnRate: true,
      masteryMap: {},   // id -> 'mastered' | 'fuzzy' | 'unknown'（由服务端 last_status 还原）
      favorites: [],    // 收藏 id 数组（服务端）
      navList: [],      // 当前列表上下文（详情页上一题/下一题用）
      loading: false,
      listMode: 'all'   // 'all' | 'favorites' | 'wrongbook'
    };

    const LS_KEY = 'mian' + 'shi_ui_prefs';
    const TOKEN_KEY = 'mian' + 'shi_token';

    function loadPersistedState() {
      try {
        const tk = localStorage.getItem(TOKEN_KEY);
        if (tk) state.token = tk;
        const saved = localStorage.getItem(LS_KEY);
        if (saved) {
          const p = JSON.parse(saved);
          if (p.themeMode) state.themeMode = p.themeMode;
          if (typeof p.alwaysExpandAnswer === 'boolean') state.alwaysExpandAnswer = p.alwaysExpandAnswer;
          if (typeof p.autoNextOnRate === 'boolean') state.autoNextOnRate = p.autoNextOnRate;
          if (p.expandedTracks) state.expandedTracks = p.expandedTracks;
          if (Number.isFinite(p.lastQuestionId)) state.lastQuestionId = p.lastQuestionId;
        }
        // 跨子域：cookie 优先于本机旧值
        if (window.MxTheme) state.themeMode = window.MxTheme.get();
      } catch (e) {
        // localStorage 不可用时静默降级
      }
    }

    function savePersistedState() {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({
          themeMode: state.themeMode,
          alwaysExpandAnswer: state.alwaysExpandAnswer,
          autoNextOnRate: state.autoNextOnRate,
          expandedTracks: state.expandedTracks,
          lastQuestionId: state.lastQuestionId
        }));
      } catch (e) {}
    }

    function saveToken(tk) {
      state.token = tk || '';
      try {
        if (tk) localStorage.setItem(TOKEN_KEY, tk);
        else localStorage.removeItem(TOKEN_KEY);
      } catch (e) {}
    }

    // 4. Theme Management (Light / Dark / System)
    function applyTheme() {
      const root = document.documentElement;
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const isDark = state.themeMode === 'dark' || (state.themeMode === 'system' && prefersDark);
      if (isDark) {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
      // Update active button style
      ['light', 'dark', 'system'].forEach(mode => {
        const btn = document.getElementById('theme-btn-' + mode);
        if (!btn) return;
        if (state.themeMode === mode) {
          btn.className = 'p-1.5 rounded-lg bg-white dark:bg-slate-700 text-brand-600 dark:text-brand-400 shadow-xs transition';
        } else {
          btn.className = 'p-1.5 rounded-lg text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';
        }
      });
    }

    function setThemeMode(mode) {
      state.themeMode = mode;
      if (window.MxTheme) window.MxTheme.set(mode);
      savePersistedState();
      applyTheme();
      const labels = { light: '已切换为浅色模式', dark: '已切换为深色模式', system: '已切换为跟随系统主题' };
      showToast(labels[mode] || '主题已更新');
    }

    // 4.5 轻量过渡动画（Web Animations API，无第三方依赖，尊重系统「减少动态效果」）
    const ANIM = {
      reduce: !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches),
      dir: 0, // 1 = 下一题，-1 = 上一题；由 goDetailSibling 预置
      ease: 'cubic-bezier(0.16, 1, 0.3, 1)'
    };
    let LAST_ROUTE = null;

    function animOK() {
      if (ANIM.reduce) return false;
      // 系统里中途切换「减少动态效果」也立刻生效
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false;
      return document.visibilityState !== 'hidden'
        && typeof Element !== 'undefined' && !!Element.prototype.animate;
    }

    // 统一的内容替换入口
    //   route   换页：旧视图快照淡出 + 新内容位移淡入
    //   soft    同页刷新（切筛选/收藏）：不整页闪，只让列表行错峰浮现
    //   instant 直接替换（自评、加载更多等局部刷新）
    function swapView(container, html, opts) {
      if (!container) return;
      opts = opts || {};
      const kind = opts.kind || 'route';
      container.querySelectorAll('.view-ghost').forEach(node => node.remove());
      if (kind === 'instant' || !animOK()) {
        container.innerHTML = html;
        return;
      }
      const old = container.firstElementChild;
      let ghost = null;
      // loading / error 占位不参与淡出，避免出现「转圈淡出」的怪画面
      if (kind === 'route' && old && !old.hasAttribute('data-loading')) {
        ghost = old.cloneNode(true);
        ghost.removeAttribute('id');
        ghost.querySelectorAll('[id]').forEach(node => node.removeAttribute('id'));
        ghost.classList.add('view-ghost');
        ghost.setAttribute('aria-hidden', 'true');
      }
      container.innerHTML = html;
      const fresh = container.firstElementChild;
      if (ghost) {
        container.appendChild(ghost);
        const fade = ghost.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 170, easing: 'ease-out', fill: 'forwards' });
        const cleanup = () => { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); };
        fade.addEventListener('finish', cleanup);
        setTimeout(cleanup, 500);
      }
      if (fresh) {
        const dir = opts.dir || 0;
        const from = dir
          ? { opacity: 0, transform: 'translate3d(' + (dir * 28) + 'px, 0, 0)' }
          : { opacity: 0, transform: 'translate3d(0, 8px, 0)' };
        fresh.animate([from, { opacity: 1, transform: 'translate3d(0, 0, 0)' }],
          { duration: 210, easing: ANIM.ease });
      }
      if (!ghost) animateRows(container);
    }

    // 列表行逐条浮现：只动前 16 行，长列表也不掉帧
    function animateRows(root) {
      if (!root) return;
      const rows = root.querySelectorAll('[data-row-anim]');
      const limit = Math.min(rows.length, 16);
      for (let i = 0; i < limit; i++) {
        rows[i].animate(
          [{ opacity: 0, transform: 'translate3d(0, 6px, 0)' }, { opacity: 1, transform: 'translate3d(0, 0, 0)' }],
          { duration: 170, delay: i * 12, easing: 'ease-out', fill: 'backwards' }
        );
      }
    }

    // 详情页「上一题 / 下一题」：给换页动画一个左右方向
    function goDetailSibling(id, dir) {
      ANIM.dir = dir || 0;
      navigateTo('/q/' + id);
    }

    // 5. Toast Helper (No browser alert/confirm)
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const toast = document.createElement('div');
      const colorClass = type === 'success'
        ? 'border-emerald-500/30 bg-emerald-950/90 text-emerald-100'
        : type === 'warning'
        ? 'border-amber-500/30 bg-amber-950/90 text-amber-100'
        : 'border-slate-700 bg-slate-900/95 text-white';
      toast.className = `px-4 py-2.5 rounded-xl border ${colorClass} text-xs font-medium shadow-lg flex items-center gap-2`;
      toast.innerHTML = `<span class="w-2 h-2 rounded-full bg-brand-400"></span><span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);
      if (animOK()) {
        toast.animate(
          [{ opacity: 0, transform: 'translate3d(0, 10px, 0)' }, { opacity: 1, transform: 'translate3d(0, 0, 0)' }],
          { duration: 200, easing: ANIM.ease }
        );
      }
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.2s ease';
        setTimeout(() => toast.remove(), 220);
      }, 2400);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

// 6. Global Counts & Sidebar Rendering（计数来自服务端）
    function computeStats() {
      // 以 QUESTIONS（服务端列表）为唯一数据源，避免两份状态不同步
      let mastered = 0, fuzzy = 0, unknown = 0, favs = 0;
      QUESTIONS.forEach(q => {
        if (q.lastStatus === 'mastered') mastered++;
        else if (q.lastStatus === 'fuzzy') fuzzy++;
        else if (q.lastStatus === 'unknown') unknown++;
        if (q.favorite) favs++;
      });
      return {
        total: API_TOTAL || QUESTIONS.length,
        mastered,
        fuzzy,
        unknown,
        done: mastered + fuzzy + unknown,
        wrongTotal: fuzzy + unknown,
        favTotal: favs,
        signedIn: !!state.user
      };
    }

    // 由 QUESTIONS 回填 masteryMap / favorites（侧栏筛选与徽标使用）
    function reconcileProgress() {
      const map = {};
      const favs = [];
      QUESTIONS.forEach(q => {
        if (q.lastStatus) map[q.id] = q.lastStatus;
        if (q.favorite) favs.push(q.id);
      });
      state.masteryMap = map;
      state.favorites = favs;
    }

    function updateHeaderAndSidebarBadges() {
      const stats = computeStats();

      const elFav = document.getElementById('sidebar-fav-count');
      const elWrong = document.getElementById('sidebar-wrong-count');
      const elTotal = document.getElementById('nav-all-count');

      if (elMastered) elMastered.textContent = stats.mastered;
      if (elFuzzy) elFuzzy.textContent = stats.fuzzy;
      if (elUnknown) elUnknown.textContent = stats.unknown;
      if (elFav) elFav.textContent = stats.favTotal;
      if (elWrong) elWrong.textContent = stats.wrongTotal;
      if (elTotal) elTotal.textContent = API_TOTAL || '';

      const authLabel = document.getElementById('auth-btn-label');
      const syncDot = document.getElementById('sync-status-dot');
      const syncText = document.getElementById('sync-status-text');
      const resetBtn = document.getElementById('btn-reset-progress');
      if (state.user) {
        if (authLabel) authLabel.textContent = (state.user.display_name || state.user.username);
        if (syncDot) syncDot.className = 'w-2 h-2 rounded-full bg-brand-500 animate-pulse';
        if (syncText) syncText.textContent = '云端同步已开启';
        if (resetBtn) resetBtn.classList.add('hidden');
      } else {
        if (authLabel) authLabel.textContent = '登录 / 注册';
        if (syncDot) syncDot.className = 'w-2 h-2 rounded-full bg-slate-300 dark:bg-slate-600';
        if (syncText) syncText.textContent = '未登录 · 进度不保存';
        if (resetBtn) resetBtn.classList.add('hidden');

    function switchSidebarTab(tabName) {

    function updateSidebarModeUI() {
      const tabQ = document.getElementById('sidebar-tab-questions');

          tabQ.className = 'py-1.5 px-2 rounded-lg flex items-center justify-center gap-1.5 text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition';

    function getScopeDisplayLabel(currentQ, currentTrackObj) {
      const sc = state.sidebarQuestionScope;
      if (sc === 'category') return `当前章节：${currentQ ? currentQ.categoryName : ''}`;
      if (sc === 'track') return `当前方向：${currentTrackObj ? currentTrackObj.name : ''}`;
      if (sc === 'all') return `全部题目 (${QUESTIONS.length} 题)`;
      if (sc === 'wrongbook') return '错题本 (模糊 / 不会)';
      if (sc === 'favorites') return '我的收藏夹';
      if (sc.startsWith('cat:')) {
        const catId = sc.replace('cat:', '');
        for (const g of TRACK_GROUPS) {
          const found = g.categories.find(c => c.id === catId);
          if (found) return `${g.shortName} · ${found.name}`;
        }
      }
      return '全部题目';
    }

    function getScopeBadgeDotClass(currentTrackObj) {
      const sc = state.sidebarQuestionScope;
      if (sc === 'wrongbook') return 'bg-rose-500';
      if (sc === 'favorites') return 'bg-amber-500';
      if (sc === 'all') return 'bg-indigo-500';
      if (sc.startsWith('cat:')) {
        const catId = sc.replace('cat:', '');
        const foundG = TRACK_GROUPS.find(g => g.categories.some(c => c.id === catId));
        if (foundG) return foundG.dotClass;
      }
      return currentTrackObj ? currentTrackObj.dotClass : 'bg-brand-500';
    }

    function toggleSidebarScopeMenu(e) {
      if (e) e.stopPropagation();
      state.sidebarScopeMenuOpen = !state.sidebarScopeMenuOpen;
      if (state.sidebarScopeMenuOpen) {
        const currentQ = QUESTIONS.find(item => item.id === state.currentQuestionId) || QUESTIONS[0];
        if (state.sidebarQuestionScope.startsWith('cat:')) {
          const catId = state.sidebarQuestionScope.replace('cat:', '');
          const foundG = TRACK_GROUPS.find(g => g.categories.some(c => c.id === catId));
          if (foundG) state.sidebarScopePopoverTrack = foundG.id;
        } else {
          state.sidebarScopePopoverTrack = (currentQ && currentQ.track) || 'java';

      }
      renderSidebarQuestionList();
    }

    function switchScopePopoverTrack(trackId, e) {
      if (e) e.stopPropagation();
      state.sidebarScopePopoverTrack = trackId;
      renderSidebarQuestionList();

    function setSidebarQuestionScope(scopeVal) {
      state.sidebarQuestionScope = scopeVal;
      state.sidebarScopeMenuOpen = false;
      if (scopeVal.startsWith('cat:')) {
        const targetCat = scopeVal.replace('cat:', '');
        const group = TRACK_GROUPS.find(g => g.categories.some(c => c.id === targetCat));
        const firstInCat = QUESTIONS.find(q => q.categoryId === targetCat && (!group || q.track === group.id));
        if (firstInCat && routePath().startsWith('/q/')) {
          navigateTo(`/q/${firstInCat.id}`);

      renderSidebarQuestionList();

    function setSidebarStatusFilter(statusVal) {

    function handleSidebarSearchInput(val) {
      state.sidebarSearch = val;
      renderSidebarQuestionList();

    // 侧栏列表内容签名：只有范围/筛选/题目状态变化才重建 DOM。
    // 点「下一题」只改当前题，走增量高亮即可，避免整列从第一题重排 + 长距离滚动。
    let SIDEBAR_LIST_SIG = null;

    function sidebarListSignature(visible) {
      const parts = [state.sidebarQuestionScope, state.sidebarStatusFilter, state.sidebarSearch.trim(), visible.length];
      const detail = visible.map(q => q.id + (q.favorite ? 'f' : '') + (state.masteryMap[q.id] || '-')).join('.');
      return parts.join('|') + '|' + detail;
    }

    function renderSidebarQuestionList() {
      const container = document.getElementById('sidebar-question-list');
      if (!container) return;

      const currentQ = QUESTIONS.find(item => item.id === state.currentQuestionId) || QUESTIONS[0] || null;
      const currentTrackObj = currentQ ? (TRACK_GROUPS.find(g => g.id === currentQ.track) || TRACK_GROUPS[0]) : TRACK_GROUPS[0];

      // 按当前题单范围筛选
      const scopedQuestions = QUESTIONS.filter(q => {
        const sc = state.sidebarQuestionScope;
        if (sc === 'category') return currentQ ? q.categoryId === currentQ.categoryId && q.track === currentQ.track : true;
        if (sc === 'track') return currentQ ? q.track === currentQ.track : true;
        if (sc === 'wrongbook') {
          const m = state.masteryMap[q.id];
          return m === 'fuzzy' || m === 'unknown';
        }
        if (sc === 'favorites') return state.favorites.includes(q.id);
        if (sc.startsWith('cat:')) {
          const targetCat = sc.replace('cat:', '');
          return q.categoryId === targetCat;
        }
        return true; // 'all'
      });

      const totalScoped = scopedQuestions.length || 1;
      const masteredScoped = scopedQuestions.filter(q => state.masteryMap[q.id] === 'mastered').length;
      const progressPct = Math.round((masteredScoped / totalScoped) * 100);

      const visibleQuestions = scopedQuestions.filter(q => {
        const m = state.masteryMap[q.id] || 'unrated';
        if (state.sidebarStatusFilter === 'mastered' && m !== 'mastered') return false;
        if (state.sidebarStatusFilter === 'unmastered' && m === 'mastered') return false;
        if (state.sidebarSearch.trim() !== '') {
          const kw = state.sidebarSearch.trim().toLowerCase();
          const matchTitle = q.title.toLowerCase().includes(kw);
          const matchTag = q.tags.some(t => String(t).toLowerCase().includes(kw));
          const matchCat = q.categoryName.toLowerCase().includes(kw);
          if (!matchTitle && !matchTag && !matchCat) return false;
        }
        return true;
      });

      const sig = sidebarListSignature(visibleQuestions);
      const hasList = !!container.querySelector('#sidebar-question-scroll');
      if (hasList && sig === SIDEBAR_LIST_SIG) {
        syncSidebarActiveItem();
        return;
      }
      const prevScrollTop = hasList ? (container.querySelector('#sidebar-question-scroll').scrollTop || 0) : 0;

      const statusIcon = (qId) => {
        const st = state.masteryMap[qId];
        if (st === 'mastered') {
          return `<span class="w-4 h-4 rounded-full bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 flex items-center justify-center text-[10px] font-bold shrink-0" title="已掌握">✓</span>`;
        }
        if (st === 'fuzzy') {
          return `<span class="w-4 h-4 rounded-full bg-amber-500/15 text-amber-600 dark:text-amber-400 border border-amber-500/30 flex items-center justify-center text-[10px] font-bold shrink-0" title="有点模糊">!</span>`;
        }
        if (st === 'unknown') {
          return `<span class="w-4 h-4 rounded-full bg-rose-500/15 text-rose-600 dark:text-rose-400 border border-rose-500/30 flex items-center justify-center text-[10px] font-bold shrink-0" title="还不会">✕</span>`;
        }
        return `<span class="w-4 h-4 rounded-full border border-slate-300 dark:border-slate-700 text-slate-400 flex items-center justify-center text-[9px] font-mono shrink-0" title="未自评">○</span>`;
      };

      const diffPill = (diff) => {
        if (diff === '简单') return 'text-emerald-600 dark:text-emerald-400 bg-emerald-500/10';
        if (diff === '中等') return 'text-amber-600 dark:text-amber-400 bg-amber-500/10';
        return 'text-rose-600 dark:text-rose-400 bg-rose-500/10';
      };

      const countOf = (pred) => QUESTIONS.filter(pred).length;
      const curCatName = currentQ ? currentQ.categoryName : '';

      container.innerHTML = `
        <div id="sidebar-question-scroll" class="flex-1 overflow-y-auto p-2.5 space-y-1.5">
          ${visibleQuestions.length === 0 ? `
            <div class="py-10 px-3 text-center space-y-2">
              <div class="text-xs text-slate-400">本节还没有匹配的题目</div>
              <button
                type="button"
                onclick="setSidebarStatusFilter('all'); handleSidebarSearchInput('');"
                class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline"
              >
                清空侧栏筛选
              </button>
            </div>
          ` : visibleQuestions.map(item => {
            const isCurrent = item.id === state.currentQuestionId && routePath().startsWith('/q/');
            const isFav = state.favorites.includes(item.id);
            return `
              <button
                type="button"
                data-qid="${item.id}"
                data-sbactive="${isCurrent ? '1' : '0'}"
                onclick="selectQuestionFromSidebarList(${item.id})"
                class="w-full text-left p-2.5 rounded-xl border transition-all group ${
                  isCurrent
                    ? 'bg-brand-500/10 dark:bg-brand-500/15 border-brand-500/40 shadow-2xs'
                    : 'bg-white dark:bg-slate-900/40 border-slate-200/60 dark:border-slate-800/70 hover:border-brand-500/30 hover:bg-slate-50 dark:hover:bg-slate-800/60'
                }"
              >

                    ${statusIcon(item.id)}
                  </div>
                  <div class="min-w-0 flex-1 space-y-1">
                    <div class="flex items-center justify-between gap-1.5">
                      <span data-sb-num class="font-mono text-[11px] font-semibold ${isCurrent ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400'}">
                        #${item.id} · ${escapeHtml(item.categoryName)}
                      </span>
                      <div class="flex items-center gap-1 shrink-0">
                        <span data-sb-fav="${item.id}" class="${isFav ? '' : 'hidden '}text-amber-500 text-[11px]" title="已收藏">★</span>

      SIDEBAR_LIST_SIG = sig;
      const wrap = document.getElementById('sidebar-question-scroll');
      if (wrap) {
        // 沿用重建前的滚动位置：不从第一题重新开始，只在当前题不可见时小幅对齐
        wrap.scrollTop = prevScrollTop;
        // 首屏布局要好几帧才稳定（字体/样式到位后行高会变），这里多锚点校正
        scheduleSidebarCenter();
      }
    }

    // 只切换「当前题」高亮，不重建整个列表
    const SB_ITEM_ON = ['bg-brand-500/10', 'dark:bg-brand-500/15', 'border-brand-500/40', 'shadow-2xs'];
    const SB_ITEM_OFF = ['bg-white', 'dark:bg-slate-900/40', 'border-slate-200/60', 'dark:border-slate-800/70', 'hover:border-brand-500/30', 'hover:bg-slate-50', 'dark:hover:bg-slate-800/60'];

    function setSidebarItemActive(btn, on) {
      if (!btn) return;
      btn.classList.remove(...(on ? SB_ITEM_OFF : SB_ITEM_ON));
      btn.classList.add(...(on ? SB_ITEM_ON : SB_ITEM_OFF));
      btn.dataset.sbactive = on ? '1' : '0';
      const num = btn.querySelector('[data-sb-num]');
      if (num) {
        num.classList.toggle('text-brand-600', on);
        num.classList.toggle('dark:text-brand-400', on);
        num.classList.toggle('text-slate-400', !on);
      }
      const title = btn.querySelector('[data-sb-title]');
      if (title) {
        ['font-bold', 'text-slate-900', 'dark:text-white'].forEach(c => title.classList.toggle(c, on));
        ['font-medium', 'text-slate-700', 'text-slate-300'].forEach(c => title.classList.toggle(c, !on));
      }
    }

    function syncSidebarActiveItem() {
      const wrap = document.getElementById('sidebar-question-scroll');
      if (!wrap) return;
      const id = state.currentQuestionId;
      const onDetail = routePath().startsWith('/q/');
      wrap.querySelectorAll('button[data-qid]').forEach(btn => {
        const want = onDetail && parseInt(btn.dataset.qid, 10) === id;
        if ((btn.dataset.sbactive === '1') !== want) setSidebarItemActive(btn, want);
      });
      // 默认把当前题放在侧栏正中（上下都留出上下文），而不是贴边
      centerSidebarOnCurrent(0);
    }

    // 侧栏列表重渲染会重置滚动位置，这里按当前题重新对齐
    function restoreSidebarListScroll() {
      if (routePath().startsWith('/q/') && typeof scrollSidebarToCurrent === 'function') {
        scrollSidebarToCurrent();
      }
    }

    function selectQuestionFromSidebarList(qId) {
      closeMobileSidebar();
      navigateTo(`/q/${qId}`);
    }

    function renderSidebarCategories() {
      const container = document.getElementById('sidebar-categories');
      if (!container) return;

      const path = routePath();
      const navMap = {
        'nav-home': path === '/',
        'nav-all': path.startsWith('/list') && state.listCategoryFilter === 'all',
        'nav-favorites': path.startsWith('/favorites'),
        'nav-wrongbook': path.startsWith('/wrongbook')
      };
      Object.entries(navMap).forEach(([id, active]) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (active) {
          el.className = 'w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-semibold bg-brand-500/10 text-brand-600 dark:text-brand-400 transition-colors';
        } else {
          el.className = 'w-full flex items-center justify-between px-3 py-2 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/70 transition-colors';
        }
      });

      let html = '';
      TRACK_GROUPS.forEach(group => {
        const isExpanded = state.expandedTracks[group.id] !== false;
        html += `
          <div class="space-y-1">
            <button
              type="button"
              onclick="toggleSidebarTrack('${group.id}')"
              class="w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition"
            >
              <span class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full ${group.dotClass}"></span>
                <span>${group.name}</span>
              </span>
              <span class="flex items-center gap-1.5">
                <span class="font-mono text-[11px] text-slate-400">${group.totalCount} 题</span>
                <svg class="w-3.5 h-3.5 transform transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                </svg>
              </span>
            </button>
            <div class="${isExpanded ? 'space-y-0.5 pl-2' : 'hidden'}">
              ${group.categories.map(cat => {
                const isActive = path.startsWith('/list') && state.listCategoryFilter === cat.id;
                return `
                  <button
                    type="button"
                    onclick="selectCategoryFromSidebar('${group.id}', '${cat.id}')"
                    class="w-full flex items-center justify-between px-3 py-1.5 rounded-lg text-xs font-medium transition-colors ${
                      isActive
                        ? 'bg-brand-500/10 text-brand-600 dark:text-brand-400 font-semibold'
                        : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200'
                    }"
                  >
                    <span class="truncate">${cat.name}</span>
                    <span class="font-mono text-[11px] ${isActive ? 'text-brand-600 dark:text-brand-400' : 'text-slate-400 dark:text-slate-500'}">${cat.count}</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function toggleSidebarTrack(trackId) {
      state.expandedTracks[trackId] = !state.expandedTracks[trackId];
      savePersistedState();
      renderSidebarCategories();
    }

    function selectCategoryFromSidebar(trackId, categoryId) {
      state.listTrackFilter = trackId;
      state.listCategoryFilter = categoryId;
      closeMobileSidebar();
      navigateTo(`/list?cat=${categoryId}`);
    }

// 7. Mobile Sidebar Controls
    function toggleMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (!sidebar || !backdrop) return;
      const isHidden = sidebar.classList.contains('-translate-x-full');
      if (isHidden) {
        sidebar.classList.remove('-translate-x-full');
        backdrop.classList.remove('hidden');
      } else {
        closeMobileSidebar();
      }
    }

    function closeMobileSidebar() {
      const sidebar = document.getElementById('app-sidebar');
      const backdrop = document.getElementById('mobile-sidebar-backdrop');
      if (sidebar) sidebar.classList.add('-translate-x-full');
      if (backdrop) backdrop.classList.add('hidden');
    }

    // 8. Router & View Dispatch（History API 路径路由：/ 首页 · /list · /q/<id> · /favorites · /wrongbook）
    function routePath() {
      let p = window.location.pathname || '/';
      if (p.endsWith('/index.html')) p = p.slice(0, -'/index.html'.length) || '/';
      if (p.length > 1) p = p.replace(/\/+$/, '') || '/';
      return p;
    }

    function currentRouteUrl() {
      return routePath() + (window.location.search || '');
    }

    function navigateTo(url) {
      // 兼容旧调用：传 '#/wrongbook' 也会归一化成 '/wrongbook'
      let target = String(url == null ? '/' : url).trim();
      if (target.startsWith('#')) target = target.slice(1);
      if (!target.startsWith('/')) target = '/' + target;
      if (currentRouteUrl() === target) {
        renderCurrentRoute();
        return;
      }
      history.pushState({}, '', target);
      renderCurrentRoute();
    }

    // 旧的 '#/wrongbook' 链接自动迁移成干净路径，保证收藏夹里的老地址照样能打开
    function migrateLegacyHashRoute() {
      const raw = window.location.hash || '';
      if (!raw.startsWith('#/')) return;
      const target = raw.slice(1) || '/';
      history.replaceState({}, '', target);
    }

    function setLoadingView(text) {
      const container = document.getElementById('view-container');
      if (!container) return;
      container.innerHTML = `
        <div data-loading="1" class="py-24 flex flex-col items-center justify-center gap-3 animate-fade-in">
          <div class="w-7 h-7 rounded-full border-2 border-brand-500/30 border-t-brand-500 animate-spin"></div>
          <div class="text-xs text-slate-400">${escapeHtml(text || '正在加载题库…')}</div>
        </div>
      `;
    }

    function setErrorView(err) {
      const container = document.getElementById('view-container');
      if (!container) return;
      const msg = (err && err.message) || '加载失败';
      container.innerHTML = `
        <div data-loading="1" class="py-24 flex flex-col items-center justify-center gap-3 animate-fade-in">
          <div class="w-11 h-11 rounded-2xl bg-rose-500/10 text-rose-500 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
          </div>
          <div class="text-sm font-semibold text-slate-700 dark:text-slate-200">${escapeHtml(msg)}</div>
          <button type="button" onclick="renderCurrentRoute()" class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white hover:bg-brand-500 transition">重新加载</button>
        </div>
      `;
    }

    async function boot() {
      if (BOOTED) return;
      setLoadingView('正在加载题库…');
      await loadCategories();
      await loadAllQuestions();
      if (state.token) {
        await refreshMe();
        await loadStats();
      }
      BOOTED = true;
    }

    async function renderCurrentRoute() {
      const path = routePath();
      const params = new URLSearchParams(window.location.search || '');

      // 同页刷新（切筛选、收藏等）只做行级动效；路径真的变了才做整页过渡
      const routeSearch = window.location.search || '';
      const prevRoute = LAST_ROUTE;
      const sameRoute = !!prevRoute && prevRoute.path === path && prevRoute.search === routeSearch;
      // 同页刷新（切筛选/清筛选等）直接换 DOM：原来的 soft 动画会让整页内容从下方 8px 淡入，
      // 每次点筛选都像「抖一下」，非常影响手感。
      const swapKind = sameRoute ? 'instant' : 'route';
      let navDir = ANIM.dir;
      ANIM.dir = 0;
      if (!navDir && !sameRoute && prevRoute && prevRoute.path.startsWith('/q/') && path.startsWith('/q/')) {
        const prevId = parseInt(prevRoute.path.slice(3), 10);
        const nextId = parseInt(path.slice(3), 10);
        if (prevId && nextId && prevId !== nextId) navDir = nextId > prevId ? 1 : -1;
      }
      LAST_ROUTE = { path: path, search: routeSearch };

      // 换页先回到顶部，淡出快照才对得上当前可见区域；同页刷新保持滚动位置
      const mainScroll = document.getElementById('main-scroll-container');
      if (mainScroll && !sameRoute) {
        // 「题 → 题」切换时保持顶栏现状：原来收起就继续收起，沉浸刷题不被打断。
        // 回顶会触发 y<=8 的自动展开逻辑，所以这里用 HEADER_SUPPRESS_REVEAL 抑制一次。
        const header = document.getElementById('app-header');
        const keepHeaderHidden = !!(prevRoute && prevRoute.path.startsWith('/q/')
          && path.startsWith('/q/')
          && header && header.classList.contains('header-hidden'));
        if (keepHeaderHidden) HEADER_SUPPRESS_REVEAL = true;
        mainScroll.scrollTop = 0;
        if (!keepHeaderHidden) showAppHeader();   // 从列表/首页进入详情时，顶栏正常可见
      }

      // 错题本只收录「有点模糊 / 还不会」，掌握度筛选不可能命中掌握的题，进来就复位
      if (path === '/wrongbook' && (state.listMasteryFilter === 'mastered' || state.listMasteryFilter === 'unrated')) {
        state.listMasteryFilter = 'all';
      }

      if (params.has('cat')) {
        const catId = params.get('cat');
        state.listCategoryFilter = catId;
        const foundTrack = TRACK_GROUPS.find(g => g.categories.some(c => c.id === catId));
        if (foundTrack) state.listTrackFilter = foundTrack.id;
      } else if (path === '/list') {
        state.listCategoryFilter = 'all';
      }
      if (params.has('q')) {
        state.searchQuery = params.get('q') || '';
        const input = document.getElementById('global-search-input');
        if (input && input.value !== state.searchQuery) input.value = state.searchQuery;
      }

      const container = document.getElementById('view-container');
      if (!container) return;

      if (!BOOTED) {
        try {
          await boot();
        } catch (e) {
          setErrorView(e);
          return;
        }
      } else if (state.token && !state.user) {
        await refreshMe();
      }

      // 侧栏「本节题目」跟随当前小节；收藏夹 / 错题本跟随各自范围
      if (path.startsWith('/q/')) state.sidebarQuestionScope = 'category';
      else if (path === '/favorites') state.sidebarQuestionScope = 'favorites';
      else if (path === '/wrongbook') state.sidebarQuestionScope = 'wrongbook';

      updateHeaderAndSidebarBadges();
      renderSidebarCategories();

      try {
        if (path.startsWith('/q/')) {
          const qId = parseInt(path.slice(3), 10);
          if (!qId) { navigateTo('/'); return; }
          state.currentQuestionId = qId;
          if (state.lastQuestionId !== qId) {
            state.lastQuestionId = qId;
            savePersistedState();
          }
          state.answerExpanded = state.alwaysExpandAnswer;
          state.codeExpanded = false;
          state.sidebarTab = 'questions';
          updateSidebarModeUI();
          const sameDetailOnScreen = !!container.querySelector('[data-detail-id="' + qId + '"]');
          if (!sameDetailOnScreen) setLoadingView('正在加载题目…');
          const detail = await loadQuestionDetail(qId);
          if (!findQuestion(qId)) {
            // 直接分享的题号可能不在当前列表缓存里，补一次
            QUESTIONS.push(decorateQuestion({
              id: detail.id, lang: detail.lang, category: detail.category,
              title: detail.title, difficulty: detail.difficulty, tags: detail.tags,
              favorite: detail.favorite, last_status: detail.last_status, in_wrong_book: false
            }));
            QUESTIONS.sort((a, b) => a.id - b.id);
          }
          swapView(container, renderQuestionDetailView(qId), { kind: swapKind, dir: navDir });
          if (typeof wrapAnswerTables === 'function') wrapAnswerTables(container);
          centerSidebarOnCurrent(0);
          requestAnimationFrame(() => centerSidebarOnCurrent(0));
        } else if (path === '/list') {
          if (!sameRoute) {
            const pg = parseInt(params.get('page'), 10);
            LIST_PAGE = Number.isFinite(pg) && pg > 0 ? pg : 1;
          }
          updateSidebarModeUI();
          swapView(container, renderQuestionListView('all'), { kind: swapKind });
        } else if (path === '/favorites') {
          if (!sameRoute) resetListPage();
          updateSidebarModeUI();
          swapView(container, renderQuestionListView('favorites'), { kind: swapKind });
        } else if (path === '/wrongbook') {
          if (!sameRoute) resetListPage();
          updateSidebarModeUI();
          swapView(container, renderQuestionListView('wrongbook'), { kind: swapKind });
        } else {
          state.listCategoryFilter = 'all';
          state.sidebarTab = 'categories';
          updateSidebarModeUI();
          swapView(container, renderHomeView(), { kind: swapKind });
        }
      } catch (e) {
        setErrorView(e);
      }

    }

// 9. VIEW 1: Home View (简洁版：标题 + 操作 + 进度 + 专题目录)

                </button>`}
            </div>
          </header>

          ${state.user ? `
            <section class="space-y-3">
              <div class="flex flex-wrap items-baseline justify-between gap-2 text-sm">
                <div class="flex flex-wrap items-baseline gap-x-5 gap-y-1 text-slate-500 dark:text-slate-400">
                  <span>已掌握 <b class="font-mono font-semibold text-slate-900 dark:text-white">${stats.mastered}</b> / ${total}</span>
                  <span class="inline-flex items-center gap-1.5"><i class="w-1.5 h-1.5 rounded-full bg-amber-500"></i>模糊 <b class="font-mono font-medium text-slate-700 dark:text-slate-200">${stats.fuzzy}</b></span>
                  <span class="inline-flex items-center gap-1.5"><i class="w-1.5 h-1.5 rounded-full bg-rose-500"></i>不会 <b class="font-mono font-medium text-slate-700 dark:text-slate-200">${stats.unknown}</b></span>
                </div>
                <button type="button" onclick="navigateTo('/wrongbook')"
                  class="text-sm text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white transition">
                  错题本 ${stats.wrongTotal} 题 →

              </div>
              <div class="h-1 w-full rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden flex">
                <div style="width:${pct(stats.mastered)}%" class="bg-emerald-500"></div>
                <div style="width:${pct(stats.fuzzy)}%" class="bg-amber-400"></div>
                <div style="width:${pct(stats.unknown)}%" class="bg-rose-400"></div>
              </div>
            </section>
          ` : ''}

          <div class="flex flex-wrap items-end justify-between gap-3 border-b border-slate-200 dark:border-slate-800">
            <nav class="flex gap-5 -mb-px overflow-x-auto">
              ${tabs.map(tab => {
                const active = state.homeTrackFilter === tab.id;
                return `
                  <button type="button" onclick="handleHeroTrackChange('${tab.id}')"

                      ? 'border-slate-900 dark:border-white text-slate-900 dark:text-white font-medium'
