                          class="group w-full text-left flex items-center justify-between gap-4 py-3.5 border-b border-slate-100 dark:border-slate-800/80">
                          <span class="min-w-0">
                            <span class="block text-sm font-medium text-slate-800 dark:text-slate-100 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">${escapeHtml(cat.name)}</span>
                            <span class="block mt-0.5 text-xs text-slate-400 dark:text-slate-500 truncate">${escapeHtml(cat.desc)}</span>
                          </span>
                          <span class="shrink-0 font-mono text-xs text-slate-400">
                            ${state.user ? `<span class="${done ? 'text-emerald-600 dark:text-emerald-400' : ''}">${done}</span>/` : ''}${cat.count}
                          </span>
                        </button>
                      </li>`;
                  }).join('')}
                </ul>
              </section>
            `).join('')}
          </div>
        </div>
      `;
    }

    function handleHeroTrackChange(trackId) {
      state.homeTrackFilter = trackId;
      renderCurrentRoute();
    }

    // 首页主按钮的去向：有上次学习的题就续上（切了技术方向 tab 时只认该方向的上次进度），
    // 否则回到当前范围内第一道没掌握的题。
    function heroTargetQuestion() {
      const inScope = (q) => q && (state.homeTrackFilter === 'all' || q.track === state.homeTrackFilter);
      const last = state.lastQuestionId ? findQuestion(state.lastQuestionId) : null;
      if (inScope(last)) return { q: last, resume: true };
      const pool = state.homeTrackFilter === 'all'
        ? QUESTIONS
        : QUESTIONS.filter(q => q.track === state.homeTrackFilter);
      if (!pool.length) return null;
      const firstUnmastered = pool.find(q => state.masteryMap[q.id] !== 'mastered');
      // 换设备/清过缓存时本地没有上次位置，但只要已有自评进度，仍算「继续学习」
      const hasProgress = pool.some(q => Object.prototype.hasOwnProperty.call(state.masteryMap, q.id));
      return { q: firstUnmastered || pool[0], resume: hasProgress };
    }

    function heroPrimaryLabel() {
      const t = heroTargetQuestion();
      return t && t.resume ? '继续学习' : '开始学习';
    }

    function startPracticeFromHero() {
      const t = heroTargetQuestion();
      if (!t || !t.q) {
        navigateTo('/list');
        return;
      }
      navigateTo(`/q/${t.q.id}`);
    }

    function pickRandomQuestion() {
      const pool = state.homeTrackFilter === 'all'
        ? QUESTIONS
        : QUESTIONS.filter(q => q.track === state.homeTrackFilter);
      if (!pool.length) { showToast('题库暂无题目'); return; }
      const q = pool[Math.floor(Math.random() * pool.length)];
      showToast(`已随机抽取：${q.categoryName} · #${q.id}`);
      navigateTo(`/q/${q.id}`);
    }

    function filterListByTrack(trackId) {
      state.listTrackFilter = trackId;
      state.listCategoryFilter = 'all';
      navigateTo('/list');
    }

// 10. VIEW 2: Question List View (All / Category / Search / Favorites / Wrongbook)
    const LIST_PAGE_SIZE = 10;   // 每页题数
    let LIST_PAGE = 1;           // 当前页码（从 1 起）

    function resetListPage() {
      LIST_PAGE = 1;
      try {
        const url = new URL(window.location.href);
        if (url.searchParams.has('page')) {
          url.searchParams.delete('page');
          history.replaceState({}, '', url.pathname + (url.search || ''));
        }
      } catch (e) {}
    }

    function setListPage(page) {
      const next = Math.max(1, parseInt(page, 10) || 1);
      LIST_PAGE = next;
      try {
        const url = new URL(window.location.href);
        if (next > 1) url.searchParams.set('page', next);
        else url.searchParams.delete('page');
        history.replaceState({}, '', url.pathname + (url.search || ''));
      } catch (e) {}
      const container = document.getElementById('view-container');
      if (container) swapView(container, renderQuestionListView(state.listMode), { kind: 'instant' });
      const mainScroll = document.getElementById('main-scroll-container');
      if (mainScroll) mainScroll.scrollTop = 0;
    }

    // 页码序列：1 … page-1 page page+1 … total
    function listPagerNumbers(page, total) {
      const out = [];
      const push = (n) => { if (out[out.length - 1] !== n) out.push(n); };
      for (let n = 1; n <= total; n += 1) {
        if (n === 1 || n === total || Math.abs(n - page) <= 1) push(n);
        else if (out[out.length - 1] !== '…') out.push('…');
      }
      return out;
    }

    function renderListFiltered(mode) {
      const mastery = state.listMasteryFilter;
      return QUESTIONS.filter(q => {
        if (mode === 'favorites' && !q.favorite) return false;
        if (mode === 'wrongbook') {
          // 错题本基础集合 = 自评为「有点模糊 / 还不会」的题。
          // 旧实现这里直接 return，把下面的难度 / 掌握度 / 搜索筛选全短路了，所以筛选看着失效。
          if (q.lastStatus !== 'fuzzy' && q.lastStatus !== 'unknown') return false;
          if (mastery !== 'all' && q.lastStatus !== mastery) return false;
        } else if (mode === 'all') {
          if (state.listTrackFilter !== 'all' && q.track !== state.listTrackFilter) return false;
          if (state.listCategoryFilter !== 'all' && q.categoryId !== state.listCategoryFilter) return false;
        }
        if (state.listDifficultyFilter !== 'all' && q.difficulty !== state.listDifficultyFilter) return false;
        if (mode !== 'wrongbook' && mastery !== 'all') {
          const m = q.lastStatus || 'unrated';
          if (m !== mastery) return false;
        }
        const kw = state.searchQuery.trim().toLowerCase();
        if (kw) {
          const inTitle = q.title.toLowerCase().includes(kw);
          const inCat = q.categoryName.toLowerCase().includes(kw);
          const inTags = q.tags.some(t => String(t).toLowerCase().includes(kw));
          if (!inTitle && !inCat && !inTags) return false;
        }
        return true;
      });
    }

    function renderQuestionListView(mode) {
      state.listMode = mode;
      let title = '全部面试题目';
      let subtitle = '支持按技术方向、专题分类、难度等级与自评状态组合筛选';

      if (mode === 'favorites') {
        title = '我的收藏夹';
        subtitle = '重点标记的高频面试题与核心架构考点，随时回顾背诵';
      } else if (mode === 'wrongbook') {
        title = '错题本（待攻克）';
        subtitle = '自动收录自评为「有点模糊」或「还不会」的题目，针对性查漏补缺';
      } else if (state.listCategoryFilter !== 'all') {
        for (const g of TRACK_GROUPS) {
          const found = g.categories.find(c => c.id === state.listCategoryFilter);
          if (found) {
            title = `${found.name} 专项题库`;
            subtitle = `${g.name} · 共 ${found.count} 道题 · ${found.desc || ''}`;
            break;
          }
        }
      } else if (state.listTrackFilter !== 'all') {
        const g = TRACK_GROUPS.find(x => x.id === state.listTrackFilter);
        if (g) {
          title = `${g.name} · 全部专题`;
          subtitle = `${g.name} 下共 ${g.totalCount} 道题，可继续按专题、难度与掌握度筛选`;
        }
      }

      // 收藏 / 错题本依赖服务端用户记录
      const needLogin = (mode === 'favorites' || mode === 'wrongbook') && !state.user;

      const filtered = needLogin ? [] : renderListFiltered(mode);
      const totalPages = Math.max(1, Math.ceil(filtered.length / LIST_PAGE_SIZE));
      const page = Math.min(Math.max(1, LIST_PAGE), totalPages);
      LIST_PAGE = page;
      const shown = filtered.slice((page - 1) * LIST_PAGE_SIZE, page * LIST_PAGE_SIZE);

      // 当前生效的「范围」筛选（搜索词 / 分类 / 技术方向），用于在列表头部展示可一键清除的标签
      let scopeLabel = '';
      if (state.searchQuery) scopeLabel = '搜索：' + state.searchQuery;
      else if (state.listCategoryFilter !== 'all') scopeLabel = CATEGORY_NAMES[state.listCategoryFilter] || state.listCategoryFilter;
      else if (state.listTrackFilter !== 'all') scopeLabel = (TRACK_META.find(g => g.id === state.listTrackFilter) || {}).name || state.listTrackFilter;

      const difficultyBadge = (diff) => {
        if (diff === '简单') return 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20';
        if (diff === '中等') return 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20';
        return 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20';
      };

      const masteryDot = (q) => {
        const status = q.lastStatus;
        if (status === 'mastered') return '<span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block" title="已掌握"></span>';
        if (status === 'fuzzy') return '<span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block" title="有点模糊"></span>';
        if (status === 'unknown') return '<span class="w-2.5 h-2.5 rounded-full bg-rose-500 inline-block" title="还不会"></span>';
        return '<span class="w-2.5 h-2.5 rounded-full bg-slate-300 dark:bg-slate-700 inline-block" title="未自评"></span>';
      };

      return `
        <div class="space-y-6">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white dark:bg-slate-900 rounded-2xl p-5 sm:p-6 border border-slate-200/80 dark:border-slate-800">
            <div>
              <div class="flex items-center gap-2 text-xs text-slate-400 mb-1">
                <a href="/" onclick="navigateTo('/'); return false;" class="hover:text-brand-500">首页</a>
                <span>/</span>
                <span class="text-slate-600 dark:text-slate-300">${escapeHtml(title)}</span>
              </div>
              <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white">${escapeHtml(title)}</h1>
              <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-1">${escapeHtml(subtitle)}</p>
              ${scopeLabel ? `
                <div class="mt-2.5 flex flex-wrap items-center gap-1.5 text-xs">
                  <span class="text-slate-400">当前筛选</span>
                  <span class="inline-flex items-center gap-1 pl-2.5 pr-1 py-1 rounded-lg font-medium bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">
                    <span class="max-w-[16rem] truncate">${escapeHtml(scopeLabel)}</span>
                    <button
                      type="button"
                      onclick="clearScopeFilters()"
                      class="w-5 h-5 rounded-md inline-flex items-center justify-center text-brand-600/70 hover:text-rose-500 hover:bg-rose-500/10 transition"
                      title="清除当前筛选"
                      aria-label="清除当前筛选"
                    ><svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
                  </span>
                </div>
              ` : ''}
            </div>

            <div class="flex items-center gap-2.5 shrink-0">
              ${filtered.length > 0 ? `
                <button
                  type="button"
                  onclick="navigateTo('/q/${filtered[0].id}')"
                  class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white shadow-sm shadow-brand-600/20 transition"
                >
                  <span>顺序刷当前列表 (${filtered.length} 题)</span>
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                  </svg>
                </button>
              ` : ''}
            </div>
          </div>

          ${needLogin ? `
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 py-16 px-6 text-center space-y-4">
              <div class="w-12 h-12 rounded-2xl bg-brand-500/10 text-brand-600 dark:text-brand-400 mx-auto flex items-center justify-center">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
              </div>
              <div class="space-y-1">
                <div class="text-sm font-semibold text-slate-800 dark:text-slate-100">${mode === 'favorites' ? '登录后查看收藏夹' : '登录后查看错题本'}</div>
                <p class="text-xs text-slate-500 dark:text-slate-400">${mode === 'favorites' ? '收藏记录保存在云端，登录 ai.xlingo.fun 账号后即可同步。' : '自评为「有点模糊 / 还不会」的题目会自动进入错题本。'}</p>
              </div>
              <button
                type="button"
                onclick="openLoginModal()"
                class="px-5 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white transition"
              >
                登录并同步
              </button>
            </div>
          ` : `
            <div class="bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/80 dark:border-slate-800 space-y-2.5">
              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-medium text-slate-400 mr-1">难度:</span>
                ${['all', '简单', '中等', '困难'].map(diff => {
                  const active = state.listDifficultyFilter === diff;
                  return `
                    <button
                      type="button"
                      onclick="setListDifficultyFilter('${diff}')"
                      class="px-3 py-1.5 rounded-lg text-xs font-medium transition ${
                        active
                          ? 'bg-brand-600 text-white shadow-2xs'
                          : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700'
                      }"
                    >
                      ${diff === 'all' ? '全部难度' : diff}
                    </button>
                  `;
                }).join('')}
                <button
                  type="button"
                  onclick="setListDifficultyFilter('all')"
                  class="ml-0.5 w-6 h-6 shrink-0 rounded-full inline-flex items-center justify-center text-rose-500 hover:bg-rose-500/10 transition ${state.listDifficultyFilter === 'all' ? 'invisible pointer-events-none' : ''}"
                  title="清除难度筛选"
                  aria-label="清除难度筛选"
                ><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
              </div>

              <div class="flex flex-wrap items-center gap-1.5">
                <span class="text-xs font-medium text-slate-400 mr-1">掌握度:</span>
                ${[
                  { id: 'all', label: '全部状态', dot: '' },
                  { id: 'mastered', label: '掌握了', dot: 'bg-emerald-500' },
                  { id: 'fuzzy', label: '有点模糊', dot: 'bg-amber-500' },
                  { id: 'unknown', label: '还不会', dot: 'bg-rose-500' },
                  { id: 'unrated', label: '未自评', dot: 'bg-slate-400' }
                ].filter(m => state.listMode !== 'wrongbook' || ['all', 'fuzzy', 'unknown'].includes(m.id)).map(m => {
                  const active = state.listMasteryFilter === m.id;
                  return `
                    <button
                      type="button"
                      onclick="setListMasteryFilter('${m.id}')"
                      class="px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 ${
                        active
                          ? 'bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xs'
                          : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70 dark:hover:bg-slate-700'
                      }"
                    >
                      ${m.dot ? `<span class="w-1.5 h-1.5 rounded-full ${m.dot}"></span>` : ''}
                      <span>${m.label}</span>
                    </button>
                  `;
                }).join('')}
                <button
                  type="button"
                  onclick="setListMasteryFilter('all')"
                  class="ml-0.5 w-6 h-6 shrink-0 rounded-full inline-flex items-center justify-center text-rose-500 hover:bg-rose-500/10 transition ${state.listMasteryFilter === 'all' ? 'invisible pointer-events-none' : ''}"
                  title="清除掌握度筛选"
                  aria-label="清除掌握度筛选"
                ><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
              </div>
            </div>

            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/80 dark:border-slate-800 overflow-hidden divide-y divide-slate-100 dark:divide-slate-800/80">
              ${filtered.length === 0 ? `
                <div class="py-16 px-4 text-center space-y-3">
                  <div class="w-12 h-12 rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 mx-auto flex items-center justify-center">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                  </div>
                  <div class="text-sm font-semibold text-slate-700 dark:text-slate-200">当前筛选条件下暂无匹配题目</div>
                  <p class="text-xs text-slate-400">可尝试切换难度标签、清空搜索词或返回全部题库</p>
                  <button
                    type="button"
                    onclick="clearAllListFilters()"
                    class="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white hover:bg-brand-500 transition"
                  >
                    重置全部筛选条件
                  </button>
                </div>
              ` : shown.map(q => {
                const isFav = q.favorite;
                return `
                  <div
                    data-row-anim
                    onclick="navigateTo('/q/${q.id}')"
                    class="group px-4 sm:px-6 py-4 flex items-center justify-between gap-4 hover:bg-slate-50/90 dark:hover:bg-slate-800/50 cursor-pointer transition-colors"
                  >
                    <div class="flex items-start sm:items-center gap-3.5 min-w-0 flex-1">
                      <div class="pt-1 sm:pt-0 shrink-0">
                        ${masteryDot(q)}
                      </div>
                      <div class="min-w-0 flex-1 space-y-1.5">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="font-mono text-xs text-slate-400">#${q.id}</span>
                          <span class="text-xs font-medium px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(q.categoryName)}</span>
                          <h3 class="text-sm sm:text-base font-semibold text-slate-900 dark:text-slate-100 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors">
                            ${escapeHtml(q.title)}
                          </h3>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5">
                          ${q.tags.map(tag => `
                            <span class="text-[11px] px-2 py-0.5 rounded-md bg-slate-100/80 dark:bg-slate-800/70 text-slate-500 dark:text-slate-400 font-mono">
                              ${escapeHtml(tag)}
                            </span>
                          `).join('')}
                        </div>
                      </div>
                    </div>

                    <div class="flex items-center gap-2.5 shrink-0" onclick="event.stopPropagation()">
                      <span class="text-xs font-medium px-2.5 py-1 rounded-full border ${difficultyBadge(q.difficulty)}">
                        ${q.difficulty}
                      </span>
                      <button
                        type="button"
                        onclick="toggleFavorite(${q.id})"
                        data-fav-id="${q.id}"
                        data-fav-style="icon"
                        class="p-2 rounded-lg transition ${
                          isFav
                            ? 'text-amber-500 bg-amber-500/10'
                            : 'text-slate-300 dark:text-slate-600 hover:text-amber-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                        }"
                        title="${isFav ? '取消收藏' : '加入收藏'}"
                      >
                        <svg data-fav-svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                        </svg>
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}

              ${filtered.length > 0 ? `
                <div class="px-3 sm:px-4 py-3.5 flex flex-wrap items-center justify-center gap-1.5 border-t border-slate-100 dark:border-slate-800/80">
                  <button
                    type="button"
                    onclick="setListPage(${page - 1})"
                    ${page <= 1 ? 'disabled' : ''}
                    class="px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${page <= 1
                      ? 'border-slate-200/70 dark:border-slate-800 text-slate-300 dark:text-slate-700 cursor-not-allowed'
                      : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}"
                  >上一页</button>
                  ${listPagerNumbers(page, totalPages).map(n => n === '…' ? `
                    <span class="px-1 text-xs text-slate-400 select-none">…</span>
                  ` : `
                    <button
                      type="button"
                      onclick="setListPage(${n})"
                      class="min-w-8 px-2 py-1.5 rounded-lg text-xs font-mono font-semibold transition ${n === page
                        ? 'bg-brand-600 text-white shadow-2xs'
                        : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}"
                    >${n}</button>
                  `).join('')}
                  <button
                    type="button"
                    onclick="setListPage(${page + 1})"
                    ${page >= totalPages ? 'disabled' : ''}
                    class="px-2.5 py-1.5 rounded-lg text-xs font-medium border transition ${page >= totalPages
                      ? 'border-slate-200/70 dark:border-slate-800 text-slate-300 dark:text-slate-700 cursor-not-allowed'
                      : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}"
                  >下一页</button>
                  <span class="w-full sm:w-auto text-center text-[11px] font-mono text-slate-400 sm:ml-2">第 ${page} / ${totalPages} 页 · 共 ${filtered.length} 题</span>
                </div>
              ` : ''}
            </div>
          `}
        </div>
      `;
    }

    function setListDifficultyFilter(diff) {
      state.listDifficultyFilter = diff;
      resetListPage();
      renderCurrentRoute();
    }

    function setListMasteryFilter(mastery) {
      state.listMasteryFilter = mastery;
      resetListPage();
      renderCurrentRoute();
    }

    // 只清掉「范围」类筛选（搜索 / 分类 / 技术方向），难度与掌握度保留
    function clearScopeFilters() {
      state.listCategoryFilter = 'all';
      state.listTrackFilter = 'all';
      state.searchQuery = '';
      resetListPage();
      const input = document.getElementById('global-search-input');
      if (input) input.value = '';
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) clearBtn.classList.add('hidden');
      navigateTo(state.listMode === 'favorites' ? '/favorites' : state.listMode === 'wrongbook' ? '/wrongbook' : '/list');
    }

    function clearAllListFilters() {
      state.listTrackFilter = 'all';
      state.listCategoryFilter = 'all';
      state.listDifficultyFilter = 'all';
      state.listMasteryFilter = 'all';
      state.searchQuery = '';
      resetListPage();
      const input = document.getElementById('global-search-input');
      if (input) input.value = '';
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) clearBtn.classList.add('hidden');
      navigateTo(state.listMode === 'favorites' ? '/favorites' : state.listMode === 'wrongbook' ? '/wrongbook' : '/list');
    }

// 11. VIEW 3: Question Detail / Practice View (/q/:id)
    function getDetailParts(qId) {
      const d = DETAIL_CACHE[qId];
      if (!d) return { core: '', analysis: '', followups: '', code: '' };
      return splitAnswerHtml(d.answer_html);
    }

    function getSiblings(q) {
      const list = QUESTIONS.filter(x => x.track === q.track && x.categoryId === q.categoryId);
      const idx = list.findIndex(x => x.id === q.id);
      const source = idx >= 0 ? list : QUESTIONS;
      const i = source.findIndex(x => x.id === q.id);
      return {
        index: i >= 0 ? i + 1 : 1,
        total: source.length,
        prev: i > 0 ? source[i - 1] : null,
        next: i >= 0 && i < source.length - 1 ? source[i + 1] : null
      };
    }

    // 当前小节学完后该去哪儿：同技术方向的下一节；已是该方向最后一节则顺延到下一个方向的第一节
    function getNextSection(q) {
      if (!q) return null;
      const flat = [];
      TRACK_GROUPS.forEach(g => {
        (g.categories || []).forEach(c => {
          flat.push({ track: g.id, trackName: g.name, categoryId: c.id, name: c.name, desc: c.desc || '' });
        });
      });
      const cur = flat.findIndex(s => s.track === q.track && s.categoryId === q.categoryId);
      if (cur < 0) return null;
      for (let k = cur + 1; k < flat.length; k += 1) {
        const first = QUESTIONS.find(x => x.track === flat[k].track && x.categoryId === flat[k].categoryId);
        if (first) return { ...flat[k], firstId: first.id };
      }
      return null;
    }

    // 跳到下一小节的第一题（侧栏范围会跟着当前题自动切换到新小节）
    function gotoNextSection(qId) {
      const q = findQuestion(qId);
      const sec = getNextSection(q);
      if (!sec) return false;
      navigateTo('/q/' + sec.firstId);
      return true;
    }

    function renderQuestionDetailView(qId) {
      const q = findQuestion(qId);
      if (!q) {
        return `<div class="py-20 text-center text-sm text-slate-500">题目不存在或已下线</div>`;
      }
      const parts = getDetailParts(qId);
      const sib = getSiblings(q);
      // 本节最后一题：把「返回题库」换成「下一小节」，学完可以直接往下走
      const nextSec = sib.next ? null : getNextSection(q);
      const isFav = q.favorite;
      const currentMastery = q.lastStatus;
      const progressPct = sib.total ? Math.min(100, Math.round((sib.index / sib.total) * 100)) : 0;

      const diffClass = q.difficulty === '简单'
        ? 'bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border-emerald-500/20'
        : q.difficulty === '中等'
        ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/20'
        : 'bg-rose-500/10 text-rose-600 dark:text-rose-400 border-rose-500/20';

      const codeText = htmlToCodeText(parts.code);
      const hasCode = codeText.trim().length > 0;
      const hasFollowups = parts.followups.trim().length > 0;

      return `
        <div data-detail-id="${q.id}" class="max-w-4xl mx-auto space-y-4 pb-1">
          <div id="detail-navbar" class="sticky top-0 z-20 bg-white dark:bg-slate-900 rounded-2xl p-3 sm:p-4 sm:px-6 border border-slate-200/80 dark:border-slate-800 shadow-sm flex flex-wrap items-center justify-between gap-2 sm:gap-4">
            <div class="flex items-center gap-1.5 sm:gap-2 text-xs sm:text-sm min-w-0">
              <button type="button" onclick="navigateTo('/')" class="text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 font-medium shrink-0">首页</button>
              <span class="text-slate-300 dark:text-slate-700">/</span>
              <button type="button" onclick="filterListByTrack('${q.track}')" class="text-slate-500 hover:text-brand-600 dark:hover:text-brand-400 font-medium shrink-0">${escapeHtml(q.trackName)}</button>
              <span class="text-slate-300 dark:text-slate-700">/</span>
              <button type="button" onclick="selectCategoryFromSidebar('${q.track}', '${q.categoryId}')" class="max-w-[9rem] text-slate-600 dark:text-slate-300 hover:text-brand-600 font-medium truncate">${escapeHtml(q.categoryName)}</button>
              <span class="text-slate-300 dark:text-slate-700">/</span>
              <span class="font-mono font-semibold text-brand-600 dark:text-brand-400 shrink-0">#${q.id}</span>
            </div>

            <div class="flex items-center gap-4">
              <div class="flex items-center gap-2 sm:gap-2.5 shrink-0">
                <span class="text-[11px] sm:text-xs font-mono text-slate-500 dark:text-slate-400 whitespace-nowrap">本章节 ${sib.index}/${sib.total} 题</span>
                <div class="w-12 sm:w-24 h-2 rounded-full bg-slate-100 dark:bg-slate-800 overflow-hidden">
                  <div style="width: ${progressPct}%" class="h-full bg-brand-500 rounded-full"></div>
                </div>
              </div>

              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  type="button"
                  onclick="${sib.prev ? `goDetailSibling(${sib.prev.id}, -1)` : ''}"
                  ${!sib.prev ? 'disabled' : ''}
                  class="px-2 sm:px-2.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border border-slate-200 dark:border-slate-700 ${
                    sib.prev
                      ? 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800'
                      : 'text-slate-300 dark:text-slate-700 cursor-not-allowed'
                  } transition"
                >
                  ← 上一题
                </button>
                ${nextSec ? `
                <button
                  type="button"
                  onclick="gotoNextSection(${q.id})"
                  title="下一小节：${escapeHtml(nextSec.name)}（${escapeHtml(nextSec.trackName)}）"
                  class="px-2 sm:px-2.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border border-brand-500/40 bg-brand-500/10 text-brand-600 dark:text-brand-400 hover:bg-brand-500/20 transition inline-flex items-center gap-1"
                >
                  <span>下一小节</span>
                  <span class="hidden sm:inline-block max-w-[6.5rem] truncate align-bottom text-[11px] opacity-70">· ${escapeHtml(nextSec.name)}</span>
                  <span>→</span>
                </button>` : `
                <button
                  type="button"
                  onclick="${sib.next ? `goDetailSibling(${sib.next.id}, 1)` : `navigateTo('/list')`}"
                  class="px-2 sm:px-2.5 py-1.5 rounded-lg text-xs font-medium whitespace-nowrap border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
                >
                  ${sib.next ? '下一题 →' : '返回题库'}
                </button>`}
              </div>
            </div>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-3xl p-4 sm:p-8 border border-slate-200/80 dark:border-slate-800 shadow-xs space-y-4 sm:space-y-5">
            <div class="flex items-start justify-between gap-4">
              <div class="flex flex-wrap items-center gap-2">
                <span class="text-xs font-semibold px-2.5 py-1 rounded-full border ${diffClass}">${q.difficulty}</span>
                <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">${escapeHtml(q.categoryName)}</span>
                ${q.tags.map(t => `
                  <span class="text-xs font-mono px-2.5 py-0.5 rounded-md bg-brand-500/10 text-brand-600 dark:text-brand-400 border border-brand-500/20">
                    #${escapeHtml(t)}
                  </span>
                `).join('')}
              </div>

              <button
                type="button"
                onclick="toggleFavorite(${q.id})"
                data-fav-id="${q.id}"
                data-fav-style="pill"
                class="shrink-0 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                  isFav
                    ? 'bg-amber-500/10 text-amber-600 dark:text-amber-400 border-amber-500/30'
                    : 'bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border-slate-200 dark:border-slate-700 hover:border-amber-400'
                }"
              >
                <svg data-fav-svg class="w-4 h-4" fill="${isFav ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
                <span data-fav-label>${isFav ? '已收藏' : '收藏'}</span>
              </button>
            </div>

            <h1 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white leading-snug">
              ${escapeHtml(q.title)}
            </h1>
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-xs overflow-hidden">
            <div class="px-6 py-4 bg-slate-50/70 dark:bg-slate-800/40 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <svg class="w-4 h-4 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
                </svg>
                <span class="text-sm font-bold text-slate-800 dark:text-slate-100">参考答案与深度解析</span>
              </div>

              <label class="inline-flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 cursor-pointer select-none">
                <input
                  type="checkbox"
                  ${state.alwaysExpandAnswer ? 'checked' : ''}
                  onchange="toggleAlwaysExpandAnswer(this.checked)"
                  class="rounded border-slate-300 text-brand-600 focus:ring-brand-500"
                />
                <span>背题模式（默认展开答案）</span>
              </label>
            </div>

            ${!state.answerExpanded ? `
              <div class="p-8 sm:p-12 text-center space-y-4">
                <div class="w-12 h-12 rounded-2xl bg-brand-500/10 text-brand-600 dark:text-brand-400 mx-auto flex items-center justify-center">
                  <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                  </svg>
                </div>
                <div class="space-y-1">
                  <div class="text-base font-bold text-slate-900 dark:text-white">先自己想一想，再看答案详解</div>
                  <p class="text-xs text-slate-500 dark:text-slate-400">主动回忆核心原理与关键词，比直接阅读答案记忆留存率高 3 倍</p>
                </div>
                <div class="pt-2">
                  <button
                    type="button"
                    onclick="expandCurrentAnswer()"
                    class="inline-flex items-center gap-2 px-6 py-2.5 rounded-xl text-sm font-semibold bg-brand-600 hover:bg-brand-500 text-white shadow-sm shadow-brand-600/20 transition"
                  >
                    <span>查看答案</span>
                    <kbd class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-brand-700 text-brand-100">Space</kbd>
                  </button>
                </div>
              </div>
            ` : `
              <div class="p-6 sm:p-8 space-y-6 animate-fade-in">
                <div class="rounded-2xl bg-brand-500/5 dark:bg-brand-500/10 border border-brand-500/20 p-5 space-y-2">
                  <div class="flex items-center gap-2 text-xs font-bold uppercase tracking-wider text-brand-700 dark:text-brand-300">
                    <span class="w-2 h-2 rounded-full bg-brand-500"></span>
                    <span>核心答案（面试直答精炼版）</span>
                  </div>
                  <div class="answer-prose text-sm sm:text-base text-slate-800 dark:text-slate-100 leading-relaxed">${parts.core || '<p class="text-slate-400">暂无答案</p>'}</div>
                </div>

                ${parts.analysis ? `
                  <div class="space-y-2.5">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <span class="w-1.5 h-4 rounded-full bg-indigo-500"></span>
                      <span>深入解析</span>
                    </h3>
                    <div class="answer-prose text-[15px] sm:text-base text-slate-600 dark:text-slate-300 leading-7 pl-3.5 border-l-2 border-slate-100 dark:border-slate-800">${parts.analysis}</div>
                  </div>
                ` : ''}

                ${hasFollowups ? `
                  <div class="space-y-2.5">
                    <h3 class="text-sm font-bold text-slate-900 dark:text-white flex items-center gap-2">
                      <span class="w-1.5 h-4 rounded-full bg-amber-500"></span>
                      <span>常见追问</span>
                    </h3>
                    <div class="answer-prose text-[15px] sm:text-base text-slate-600 dark:text-slate-300 leading-7 pl-3.5 border-l-2 border-slate-100 dark:border-slate-800">${parts.followups}</div>
                  </div>
                ` : ''}

                ${hasCode ? `
                  <div class="rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden">
                    <div class="px-4 py-2.5 bg-slate-100/80 dark:bg-slate-800/80 flex items-center justify-between">
                      <button
                        type="button"
                        onclick="toggleCodeBlock()"
                        class="flex items-center gap-2 text-xs font-mono font-medium text-slate-700 dark:text-slate-200 hover:text-brand-600 dark:hover:text-brand-400 transition"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/>
                        </svg>
                        <span>代码示例 · ${codeText.split('\n').length} 行 · ${state.codeExpanded ? '收起' : '展开'}</span>
                      </button>

                      <button
                        type="button"
                        onclick="copyCurrentCode()"
                        class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-medium bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:text-brand-600 border border-slate-200 dark:border-slate-700 transition"
                      >
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                        </svg>
                        <span>复制代码</span>
                      </button>
                    </div>
                    <div class="${state.codeExpanded ? '' : 'hidden'} avoid-dark-invert">${parts.code}</div>
                  </div>
                ` : ''}
              </div>
            `}
          </div>

          <div class="bg-white dark:bg-slate-900 rounded-3xl p-5 sm:p-6 border border-slate-200/80 dark:border-slate-800 shadow-xs flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div class="space-y-1">
              <div class="text-sm font-bold text-slate-900 dark:text-white">这题你掌握得怎么样？</div>
              ${state.user ? `
                <label class="inline-flex items-center gap-2 text-xs text-slate-500 dark:text-slate-400 cursor-pointer">
                  <input
                    type="checkbox"
                    ${state.autoNextOnRate ? 'checked' : ''}
                    onchange="toggleAutoNextOnRate(this.checked)"
                    class="rounded border-slate-300 text-brand-600 focus:ring-brand-500"
                  />
                  <span>点选后自动进入下一题</span>
                </label>
              ` : `
                <div class="text-xs text-slate-500 dark:text-slate-400">
                  <button type="button" onclick="openLoginModal()" class="font-semibold text-brand-600 dark:text-brand-400 hover:underline">登录</button>
                  后自评结果才会保存到云端
                </div>
              `}
            </div>

            <div class="grid grid-cols-3 gap-2.5 sm:flex sm:items-center">
              <button
                type="button"
                onclick="rateQuestion(${q.id}, 'mastered')"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition flex items-center justify-center gap-1.5 ${
                  currentMastery === 'mastered'
                    ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm shadow-emerald-600/20'
                    : 'bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 border-emerald-500/25 hover:bg-emerald-500/20'
                }"
              >
                <span class="w-2 h-2 rounded-full bg-current"></span>
                <span>掌握了</span>
              </button>

              <button
                type="button"
                onclick="rateQuestion(${q.id}, 'fuzzy')"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition flex items-center justify-center gap-1.5 ${
                  currentMastery === 'fuzzy'
                    ? 'bg-amber-500 text-slate-950 border-amber-500 shadow-sm shadow-amber-500/20'
                    : 'bg-amber-500/10 text-amber-700 dark:text-amber-300 border-amber-500/25 hover:bg-amber-500/20'
                }"
              >
                <span class="w-2 h-2 rounded-full bg-current"></span>
                <span>有点模糊</span>
              </button>

              <button
                type="button"
                onclick="rateQuestion(${q.id}, 'unknown')"
                class="px-4 py-2.5 rounded-xl text-xs sm:text-sm font-semibold border transition flex items-center justify-center gap-1.5 ${
                  currentMastery === 'unknown'
                    ? 'bg-rose-600 text-white border-rose-600 shadow-sm shadow-rose-600/20'
                    : 'bg-rose-500/10 text-rose-700 dark:text-rose-300 border-rose-500/25 hover:bg-rose-500/20'
                }"
              >
                <span class="w-2 h-2 rounded-full bg-current"></span>
                <span>还不会</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function rerenderDetail() {
      const container = document.getElementById('view-container');
      if (!container) return;
      swapView(container, renderQuestionDetailView(state.currentQuestionId), { kind: 'instant' });
      if (typeof wrapAnswerTables === 'function') wrapAnswerTables(container);
    }

    function expandCurrentAnswer() {
      state.answerExpanded = true;
      rerenderDetail();
      const mainScroll = document.getElementById('main-scroll-container');
      if (mainScroll) mainScroll.scrollTop = 0;
    }

    function toggleAlwaysExpandAnswer(checked) {
      state.alwaysExpandAnswer = checked;
      state.answerExpanded = checked;
      savePersistedState();
      rerenderDetail();
    }

    function toggleCodeBlock() {
      state.codeExpanded = !state.codeExpanded;
      rerenderDetail();
    }

    function toggleAutoNextOnRate(checked) {
      state.autoNextOnRate = checked;
      savePersistedState();
    }

    function copyCurrentCode() {
      const parts = getDetailParts(state.currentQuestionId);
      const text = htmlToCodeText(parts.code);
      if (!text.trim()) { showToast('本题没有代码示例'); return; }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast('代码已复制到剪贴板', 'success');
        }).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast('代码已复制到剪贴板', 'success');
      } catch (e) {
        showToast('复制失败，请手动选择复制');
      }
      ta.remove();
    }

    const RATE_LABEL = {
      mastered: { text: '已标记为「掌握了」', toast: 'success' },
      fuzzy: { text: '已标记为「有点模糊」（进入错题本）', toast: 'warning' },
      unknown: { text: '已标记为「还不会」（进入错题本）', toast: 'warning' }
    };

    async function rateQuestion(qId, status) {
      if (!state.user) {
        showToast('请先登录，自评结果才能保存');
        openLoginModal();
        return;
      }
      const q = findQuestion(qId);
      if (!q) return;
      try {
        await API.req('/questions/' + qId + '/record', {
          method: 'POST',
          body: { status: STATUS_CODE[status] }
        });
      } catch (e) {
        showToast('记录失败：' + e.message);
        return;
      }
      q.lastStatus = status;
      if (status === 'fuzzy' || status === 'unknown') q.inWrongBook = true;
      if (detailIsOpen(qId)) DETAIL_CACHE[qId] && (DETAIL_CACHE[qId].last_status = STATUS_CODE[status]);
      updateHeaderAndSidebarBadges();
      renderSidebarQuestionList();
      loadStats().then(() => updateHeaderAndSidebarBadges());

      const meta = RATE_LABEL[status] || { text: '状态已更新', toast: 'info' };
      showToast(meta.text, meta.toast);

      const sib = getSiblings(q);
      if (state.autoNextOnRate && sib.next) {
        setTimeout(() => navigateTo(`/q/${sib.next.id}`), 260);
      } else {
        rerenderDetail();
      }
    }

    function detailIsOpen(qId) {
      return routePath() === '/q/' + qId;
    }

    async function toggleFavorite(qId) {
      if (!state.user) {
        showToast('请先登录，收藏才能同步到云端');
        openLoginModal();
        return;
      }
      const q = findQuestion(qId);
      try {
        const res = await API.req('/questions/' + qId + '/favorite', { method: 'POST' });
        const fav = !!(res && res.favorite);
        if (q) q.favorite = fav;
        if (DETAIL_CACHE[qId]) DETAIL_CACHE[qId].favorite = fav;
        // 只热更新收藏按钮与侧栏星标，不整页重绘（重绘会闪屏并把列表滚回顶部）
        syncFavoriteUI(qId, fav);
        showToast(fav ? '已加入我的收藏夹' : '已从我的收藏移除', fav ? 'success' : 'info');
      } catch (e) {
        showToast('操作失败：' + e.message);
        return;
      }
      updateHeaderAndSidebarBadges();
      if (routePath().startsWith('/favorites')) renderCurrentRoute();
      loadStats().then(() => updateHeaderAndSidebarBadges());
    }

    // 收藏状态就地同步：列表星星、详情页按钮、侧栏星标一起变
    function syncFavoriteUI(qId, fav) {
      document.querySelectorAll('[data-fav-id="' + qId + '"]').forEach(btn => {
        btn.title = fav ? '取消收藏' : '加入收藏';
        const svg = btn.querySelector('[data-fav-svg]');
        if (svg) svg.setAttribute('fill', fav ? 'currentColor' : 'none');
        const label = btn.querySelector('[data-fav-label]');
        if (label) label.textContent = fav ? '已收藏' : '收藏';
        if (btn.dataset.favStyle === 'icon') {
          ['text-amber-500', 'bg-amber-500/10'].forEach(c => btn.classList.toggle(c, fav));
          ['text-slate-300', 'dark:text-slate-600', 'hover:text-amber-400', 'hover:bg-slate-100', 'dark:hover:bg-slate-800'].forEach(c => btn.classList.toggle(c, !fav));
        } else {
          ['bg-amber-500/10', 'text-amber-600', 'dark:text-amber-400', 'border-amber-500/30'].forEach(c => btn.classList.toggle(c, fav));
          ['bg-slate-50', 'dark:bg-slate-800', 'text-slate-600', 'dark:text-slate-300', 'border-slate-200', 'dark:border-slate-700', 'hover:border-amber-400'].forEach(c => btn.classList.toggle(c, !fav));
        }
      });
      document.querySelectorAll('[data-sb-fav="' + qId + '"]').forEach(el => el.classList.toggle('hidden', !fav));
    }

    // 旧版「重置记录」按钮：服务端记录不支持一键清空，这里直接从界面移除
    function resetDemoProgress() {
      showToast('进度保存在云端，无法一键清空');
    }

    // 宽表格在窄屏可横向滚动，避免撑破页面
    function wrapAnswerTables(root) {
      const scope = root || document.getElementById('view-container');
      if (!scope) return;
      scope.querySelectorAll('.answer-prose table').forEach(table => {
        if (table.parentElement && table.parentElement.classList.contains('table-scroll')) return;
        const wrap = document.createElement('div');
        wrap.className = 'table-scroll overflow-x-auto -mx-1 px-1';
        table.parentNode.insertBefore(wrap, table);
        wrap.appendChild(table);
      });
    }

// 12. Global Search Handlers
    function handleSearchInputChange(val) {
      state.searchQuery = val;
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) {
        if (val.trim().length > 0) clearBtn.classList.remove('hidden');
        else clearBtn.classList.add('hidden');
      }
    }

    function handleGlobalSearchSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('global-search-input');
      const kw = input ? input.value.trim() : '';
      state.searchQuery = kw;
      resetListPage();
      navigateTo(`/list?q=${encodeURIComponent(kw)}`);
    }

    function clearGlobalSearch() {
      state.searchQuery = '';
      const input = document.getElementById('global-search-input');
      if (input) input.value = '';
      const clearBtn = document.getElementById('btn-clear-search');
      if (clearBtn) clearBtn.classList.add('hidden');
      if (routePath().startsWith('/list')) {
        navigateTo('/list');
      }
    }

    // 13. Login & User Session
    async function handleAuthButtonClick() {
      if (!state.user) {
        openLoginModal();
        return;
      }
      const ok = await askConfirm({
        title: '退出登录',
        message: '退出后自评与收藏将不再同步到云端，重新登录即可恢复。',
        okText: '退出登录',
        tone: 'danger'
      });
      if (ok) await logout();
    }

    async function logout() {
      saveToken('');
      API.clearAuth();
      SERVER_STATS = null;
      QUESTIONS.forEach(q => { q.favorite = false; q.lastStatus = null; q.inWrongBook = false; });
      DETAIL_CACHE = {};
      state.masteryMap = {};
      state.favorites = [];
      updateHeaderAndSidebarBadges();
      showToast('已退出登录');
      closeMobileSidebar();
      await renderCurrentRoute();
    }

    // 统一确认弹窗：替代浏览器原生 window.confirm（那个太丑，且不能定制危险色）
    let CONFIRM_RESOLVER = null;

    function askConfirm(opts) {
      const o = opts || {};
      const modal = document.getElementById('confirm-modal');
      if (!modal) return Promise.resolve(window.confirm(o.message || '确定继续？'));
      const danger = o.tone === 'danger';
      document.getElementById('confirm-title').textContent = o.title || '请确认';
      document.getElementById('confirm-message').textContent = o.message || '';
      const okBtn = document.getElementById('confirm-ok');
      okBtn.textContent = o.okText || '确定';
      okBtn.className = 'px-4 py-2 rounded-xl text-xs font-semibold text-white shadow-sm transition ' + (danger
        ? 'bg-rose-600 hover:bg-rose-500 shadow-rose-600/20'
        : 'bg-brand-600 hover:bg-brand-500 shadow-brand-600/20');
      const iconWrap = document.getElementById('confirm-icon-wrap');
      if (iconWrap) {
        iconWrap.className = 'w-10 h-10 shrink-0 rounded-xl flex items-center justify-center ' + (danger
          ? 'bg-rose-500/10 text-rose-500'
          : 'bg-brand-500/10 text-brand-500');
      }
      if (CONFIRM_RESOLVER) { const prev = CONFIRM_RESOLVER; CONFIRM_RESOLVER = null; prev(false); }
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      return new Promise(resolve => {
        CONFIRM_RESOLVER = resolve;
        setTimeout(() => { try { okBtn.focus(); } catch (e) {} }, 30);
      });
    }

    function resolveConfirm(ok) {
      const modal = document.getElementById('confirm-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
      const r = CONFIRM_RESOLVER;
      CONFIRM_RESOLVER = null;
      if (r) r(!!ok);
    }

    function openLoginModal() {
      const modal = document.getElementById('login-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
        const userInp = document.getElementById('login-username');
        if (userInp) userInp.focus();
      }
    }

    function closeLoginModal() {
      const modal = document.getElementById('login-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
      const err = document.getElementById('login-error');
      if (err) { err.textContent = ''; err.classList.add('hidden'); }
    }

    function showLoginError(msg) {
      const err = document.getElementById('login-error');
      if (!err) return;
      err.textContent = msg;
      err.classList.remove('hidden');
    }

    let LOGIN_BUSY = false;

    async function submitLoginForm(e) {
      e.preventDefault();
      if (LOGIN_BUSY) return;
      const userInp = document.getElementById('login-username');
      const passInp = document.getElementById('login-password');
      const btn = document.getElementById('btn-login-submit');
      const username = userInp ? userInp.value.trim() : '';
      const password = passInp ? passInp.value : '';
      if (!username || !password) {
        showLoginError('请输入账号与密码');
        return;
      }
      LOGIN_BUSY = true;
      if (btn) { btn.disabled = true; btn.textContent = '登录中…'; btn.classList.add('opacity-70'); }
      try {
        const data = await API.req('/auth/login', { method: 'POST', body: { username, password } });
        saveToken(data.token);
        state.user = data.user || { username };
        closeLoginModal();
        if (passInp) passInp.value = '';
        showToast(`欢迎回来，${state.user.display_name || state.user.username}`, 'success');
        // 登录后重拉全量，补齐收藏 / 自评状态
        await loadAllQuestions();
        await refreshMe();
        await loadStats();
        updateHeaderAndSidebarBadges();
        await renderCurrentRoute();
      } catch (err) {
        const msg = err && err.status === 401
          ? '账号或密码错误'
          : (err && err.message) || '登录失败';
        showLoginError(msg);
      } finally {
        LOGIN_BUSY = false;
        if (btn) { btn.disabled = false; btn.textContent = '登录并同步'; btn.classList.remove('opacity-70'); }
      }
    }

    // 14. Keyboard Shortcuts (/ 搜索, Space 展开答案, 1/2/3 自评)
    window.addEventListener('keydown', (e) => {
      const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
      if (activeTag === 'input' || activeTag === 'textarea' || activeTag === 'select') {
        if (e.key === 'Escape') document.activeElement.blur();
        return;
      }
      if (e.key === '/') {
        e.preventDefault();
        const searchInp = document.getElementById('global-search-input');
        if (searchInp) searchInp.focus();
        return;
      }
      const onDetail = routePath().startsWith('/q/');
      if (!onDetail) return;
      if (e.code === 'Space' && !state.answerExpanded) {
        e.preventDefault();
        expandCurrentAnswer();
      } else if (['1', '2', '3'].includes(e.key) && state.user) {
        e.preventDefault();
        const map = { '1': 'mastered', '2': 'fuzzy', '3': 'unknown' };
        rateQuestion(state.currentQuestionId, map[e.key]);
      }
    });

    window.addEventListener('popstate', () => {
      renderCurrentRoute();
    });
    // 同页 hash 变化（老链接/外部跳转）也走一次路由 + 迁移
    window.addEventListener('hashchange', () => {
      if ((window.location.hash || '').startsWith('#/')) migrateLegacyHashRoute();
      renderCurrentRoute();
    });

    window.addEventListener('load', () => {
      if (routePath().startsWith('/q/')) centerSidebarOnCurrent(0);
    });

    // ESC 关闭确认弹窗（有确认弹窗时优先关它）
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      const cm = document.getElementById('confirm-modal');
      if (cm && !cm.classList.contains('hidden')) {
        e.preventDefault();
        resolveConfirm(false);
      }
    });

    // Close custom popover menus on outside click
    document.addEventListener('click', () => {
      if (state.sidebarScopeMenuOpen) {
        state.sidebarScopeMenuOpen = false;
        renderSidebarQuestionList();
      }
    });

    // Initialize on load
    migrateLegacyHashRoute();
    window.addEventListener('DOMContentLoaded', async () => {
      loadPersistedState();
      applyTheme();
      initHeaderAutoHide();
      await renderCurrentRoute();
    });
    // 手机端单键循环主题：浅色 → 深色 → 跟随系统
    function cycleThemeMode() {
      const order = ['light', 'dark', 'system'];
      const idx = order.indexOf(state.themeMode);
      setThemeMode(order[(idx + 1) % order.length] || 'light');
    }

    // 9. 顶栏滚动自动隐藏 / 回滚显示
    // 锁定期与基准位置放到模块作用域，路由切换时可以强制恢复顶栏（见 showAppHeader）
    let HEADER_LAST_Y = 0;
    let HEADER_LOCKED_UNTIL = 0;   // 收起 / 展开后短暂锁定，避免布局高度变化引发的抖动
    let HEADER_SUPPRESS_REVEAL = false;  // 换题回顶时抑制一次「回到顶部就展开顶栏」，保持沉浸状态

    // 换题 / 换路由时强制顶栏可见。
    // 原实现：滚动锁定期内把 scrollTop 归零时 apply() 会直接 return，
    // 顶栏就一直停在 header-hidden，表现为「点下一题后顶栏不出现」。
    function showAppHeader() {
      const header = document.getElementById('app-header');
      if (!header) return;
      header.classList.remove('header-hidden');
      document.body.classList.remove('header-collapsed');
      HEADER_LAST_Y = 0;
      HEADER_LOCKED_UNTIL = 0;
      HEADER_SUPPRESS_REVEAL = false;
    }

    function initHeaderAutoHide() {
      const header = document.getElementById('app-header');
      const scroller = document.getElementById('main-scroll-container');
      if (!header || !scroller) return;
      let ticking = false;
      HEADER_LAST_Y = scroller.scrollTop;
      const HIDE_AFTER = 96;   // 下滑超过该距离才隐藏
      const REVEAL_UP = 12;    // 上滑超过该距离立即显示
      const LOCK_MS = 420;

      const apply = () => {
        ticking = false;
        const now = performance.now();
        const y = scroller.scrollTop;
        if (now < HEADER_LOCKED_UNTIL) { HEADER_LAST_Y = y; return; }
        const delta = y - HEADER_LAST_Y;
        HEADER_LAST_Y = y;

        if (y <= 8) {
          if (HEADER_SUPPRESS_REVEAL) { HEADER_SUPPRESS_REVEAL = false; HEADER_LOCKED_UNTIL = 0; return; }
          header.classList.remove('header-hidden');
          document.body.classList.remove('header-collapsed');
          return;
        }
        if (header.classList.contains('header-hidden')) {
          if (delta < -REVEAL_UP) {
            header.classList.remove('header-hidden');
            document.body.classList.remove('header-collapsed');
            HEADER_LOCKED_UNTIL = now + LOCK_MS;
          }
          return;
        }
        if (delta > 4 && y > HIDE_AFTER) {
          header.classList.add('header-hidden');
          document.body.classList.add('header-collapsed');
          HEADER_LOCKED_UNTIL = now + LOCK_MS;
        }
      };

      scroller.addEventListener('scroll', () => {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(apply);
        }
      }, { passive: true });

      // 沉浸刷题时内容不够长、页面停在顶部滚不动：给一个「上滑唤回顶栏」的手势出口
      scroller.addEventListener('wheel', (e) => {
        if (e.deltaY < -6 && scroller.scrollTop <= 8 && header.classList.contains('header-hidden')) {
          showAppHeader();
        }
      }, { passive: true });
      let touchStartY = 0;
      scroller.addEventListener('touchstart', (e) => {
        touchStartY = (e.touches && e.touches[0]) ? e.touches[0].clientY : 0;
      }, { passive: true });
      scroller.addEventListener('touchmove', (e) => {
        if (scroller.scrollTop > 8 || !header.classList.contains('header-hidden')) return;
        const y = (e.touches && e.touches[0]) ? e.touches[0].clientY : touchStartY;
        if (y - touchStartY > 24) { showAppHeader(); touchStartY = y; }
      }, { passive: true });
    }

    // 9.1 侧栏题目列表对齐到当前题
    // center=true 只在列表刚重建/首屏时居中一次；换题时只做「最小滚动」，
    // 当前题已可见就完全不动，避免每次下一题整列从第一题重排、长距离滚动。
    // 列表刚重建时把当前题居中；布局漂移就重试，最多 4 帧（实测首帧会算错 1000px 以上）
    function centerSidebarOnCurrent(tries) {
      const wrap = document.getElementById('sidebar-question-scroll');
      if (!wrap) return;
      const id = state.currentQuestionId;
      if (!id) return;
      const el = wrap.querySelector(`button[data-qid="${id}"]`);
      const n = tries || 0;
      if (!el || wrap.clientHeight <= 0) {
        if (n < 4) requestAnimationFrame(() => centerSidebarOnCurrent(n + 1));
        return;
      }
      const delta = el.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
      const offset = (wrap.clientHeight - el.offsetHeight) / 2;
      const diff = delta - offset;
      wrap.scrollTop = Math.max(0, wrap.scrollTop + diff);
      if (Math.abs(diff) > 4 && n < 4) requestAnimationFrame(() => centerSidebarOnCurrent(n + 1));
    }

    function scheduleSidebarCenter() {
      centerSidebarOnCurrent(0);
      requestAnimationFrame(() => centerSidebarOnCurrent(0));
      setTimeout(() => centerSidebarOnCurrent(0), 120);
      setTimeout(() => centerSidebarOnCurrent(0), 420);
    }

    function scrollSidebarToCurrent(center) {
      const wrap = document.getElementById('sidebar-question-scroll');
      if (!wrap) return;
      const id = state.currentQuestionId;
      if (!id) return;
      const el = wrap.querySelector(`button[data-qid="${id}"]`);
      if (!el) return;
      const delta = el.getBoundingClientRect().top - wrap.getBoundingClientRect().top;
      const h = el.offsetHeight;
      const margin = 8;
      const ch = wrap.clientHeight;
      if (ch <= 0) return;
      if (center) {
        wrap.scrollTop = Math.max(0, wrap.scrollTop + delta - Math.max(margin, (ch - h) / 2));
        return;
      }
      if (delta < margin) {
        wrap.scrollTop = Math.max(0, wrap.scrollTop + delta - margin);
      } else if (delta + h > ch - margin) {
        // 只向下滚「超出的那一行」，不做半屏跳转
        wrap.scrollTop = wrap.scrollTop + delta + h - (ch - margin);
      }
    }
  </script>
</body>
